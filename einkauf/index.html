<style>
/* Layout: eine schmale Spalte wie ein Zettel am Kühlschrank; Listen als Reiter oben, Eingabe fest unten (daumennah). */
:root {
  --bg: #f1f4f0;
  --paper: #ffffff;
  --ink: #18221d;
  --muted: #64716a;
  --line: #dde3dd;
  --accent: #2c7a4b;

  --accent-soft: #e2efe6;
  --marker: #f3d54e;
  --danger: #b4382f;
  --shadow: 0 1px 2px rgba(24,34,29,.06), 0 6px 20px rgba(24,34,29,.06);

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --paper: #1a211d; --ink: #e6ece7; --muted: #93a198; --line: #2a332e;
    --accent: #5dbb83; --accent-ink: #0d1a12; --accent-soft: #1f3327; --marker: #c9ac2c;
    --danger: #e0756c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --paper: #1a211d; --ink: #e6ece7; --muted: #93a198; --line: #2a332e;
  --accent: #5dbb83; --accent-ink: #0d1a12; --accent-soft: #1f3327; --marker: #c9ac2c;

}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; }
body {

.more { flex: none; width: 44px; height: 44px; margin-right: 4px; border: 0; background: none; color: var(--muted); border-radius: 10px; display: grid; place-items: center; }
.more:hover { background: var(--bg); }
.item.done .box { background: var(--accent); border-color: var(--accent); }

@keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--marker) 45%, var(--paper)); } 100% { background: var(--paper); } }

.link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: .88rem; padding: 6px 4px; }

.tools { display: flex; gap: 6px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }
.chipbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 12px; font-size: .85rem; font-weight: 500; }

/* Eingabe unten */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;

/* Bearbeiten-Blatt */
.sheet-bg { position: fixed; inset: 0; background: rgba(10,15,12,.4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {

.row2 { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.btns { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-top: 4px; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px));

.donetoggle { border: 0; background: none; padding: 6px 0; display: flex; align-items: center; gap: 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }

.setup { padding-block: 40px 20px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }

.setup p { margin: 0; color: var(--muted); max-width: 46ch; }
</style>
</head>

<script>

const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
function guessCat(text) {
  const t = text.toLowerCase();
  if (/\b(tk|tiefkühl)/.test(t)) return "tk";
  let best = null, bestLen = 0;
  for (const c of CATS) for (const w of c.words.split(" ")) {

  }
  return best || "sonst";
}
// "2 Milch", "2x Milch", "500 g Hack", "Milch x3"
function parseEntry(raw) {
  let s = raw.trim().replace(/\s+/g, " ");
  let qty = "";
  let m = s.match(/^(\d+(?:[.,]\d+)?)\s*(x|stk\.?|stück|g|kg|l|ml|pck\.?|packung(?:en)?|dosen?|flaschen?|bund)?\s+(.+)$/i);
  if (m) { qty = m[1] + (m[2] ? (/^x$/i.test(m[2]) ? "×" : " " + m[2]) : "×"); s = m[3]; }

  else if ((m = s.match(/^(\D.*?)\s+(\d{1,2})$/))) { qty = m[2] + "×"; s = m[1]; }
  s = s.charAt(0).toUpperCase() + s.slice(1);
  return { text: s, qty };
}
const keyOf = t => t.trim().toLowerCase();

// ---------- Lokaler Fallback (Datei direkt im Browser geöffnet) ----------
function localBackend() {
  const K = "einkauf.local";
  let d;
  try { d = JSON.parse(localStorage.getItem(K) || "null"); } catch (e) {}
  if (!d) d = { lists: seedLists(), items: [], history: {}, v: SEED_VERSION };
  if ((d.v || 1) < SEED_VERSION) {
    for (const l of d.lists) if (MIGRATE[l.id]) Object.assign(l, MIGRATE[l.id]);
    for (const l of seedLists()) {
      const own = ADOPT[l.id] && d.lists.find(ADOPT[l.id]);
      if (own) { own.type = l.type; continue; }
      if (!d.lists.some(x => x.id === l.id || x.id === MIGRATED_TO[l.id])) d.lists.push(l);
    }
    d.v = SEED_VERSION;
    try { localStorage.setItem(K, JSON.stringify(d)); } catch (e) {}
  }
  const save = () => { try { localStorage.setItem(K, JSON.stringify(d)); } catch (e) {} apply(); };
  const apply = () => { state.lists = d.lists.slice(); state.items = d.items.slice(); state.history = d.history; state.ready = true; render(); };
  const uid = () => Math.random().toString(36).slice(2, 10);
  setTimeout(apply, 0);
  setStatus(false, "nur auf diesem Gerät");
  return {
    addList: async (o) => { d.lists.push({ id: uid(), ...o }); save(); },
    updateList: async (id, o) => { Object.assign(d.lists.find(l => l.id === id), o); save(); },
    deleteList: async (id) => { d.lists = d.lists.filter(l => l.id !== id); d.items = d.items.filter(i => i.list !== id); save(); },
    addItem: async (o) => { const id = uid(); d.items.push({ id, ...o }); save(); return id; },
    updateItem: async (id, o) => { Object.assign(d.items.find(i => i.id === id) || {}, o); save(); },
    deleteItem: async (id) => { d.items = d.items.filter(i => i.id !== id); save(); },
    setHistory: async (h) => { d.history = h; save(); },
  };
}

// ---------- Gemeinsamer Speicher ----------
function dbBackend(db) {
  const lists = db.collection("lists"), items = db.collection("items"), hist = db.doc("meta/history");
  let got = 0;
  const loadTimer = setTimeout(() => { if (!state.ready) { setStatus(false, "keine Verbindung"); renderMessage("Keine Verbindung", "Die Listen konnten nicht geladen werden. Öffne die Seite gleich noch einmal."); } }, 10000);
  const mark = () => { if (++got >= 3 && !state.ready) { state.ready = true; clearTimeout(loadTimer); setStatus(true, "live geteilt"); } render(); };
  let seen = { l: false, i: false, h: false };
  const onErr = (e) => { if (e.code === "revoked" || e.code === "unavailable") setStatus(false, "getrennt"); };
  lists.onSnapshot(s => { state.lists = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!seen.l) { seen.l = true; mark(); } else render(); }, onErr);
  items.onSnapshot(s => { state.items = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!seen.i) { seen.i = true; mark(); } else render(); }, onErr);
  hist.onSnapshot(s => { state.history = (s.exists && s.data().counts) || {}; if (!seen.h) { seen.h = true; mark(); } else render(); }, onErr);
  const guard = p => p.catch(e => { if (e && e.code === "invalid_argument") toast("Du kannst diese Liste nur ansehen."); else if (e && e.code === "quota_exceeded") toast("Speicher voll: lösche erledigte Einträge."); else toast("Das hat nicht geklappt. Versuch es noch mal."); throw e; });
  return {
    addList: o => guard(lists.add(o)),
    updateList: (id, o) => guard(lists.doc(id).update(o)),
    deleteList: async id => { await guard(lists.doc(id).delete()); for (const i of state.items.filter(i => i.list === id)) await items.doc(i.id).delete().catch(() => {}); },
    addItem: o => { const r = items.doc(); return guard(r.set(o)).then(() => r.id); },
    updateItem: (id, o) => guard(items.doc(id).update(o)),
    deleteItem: id => guard(items.doc(id).delete()),
    setHistory: h => hist.set({ counts: h }).catch(() => {}),
  };
}

// ---------- Firebase (GitHub-Pages-Version) ----------
const MARKETS = [["rewe", "Rewe"], ["aldi", "Aldi"], ["lidl", "Lidl"], ["kaufland", "Kaufland"], ["dm", "DM"], ["egal", "Egal wo"]];
const SEED = {
  shop: MARKETS,
  todo: [["todo-paul", "Paul"], ["todo-elina", "Elina"]],
  schule: [["schule-aufgaben", "Aufgaben"], ["schule-pruefungen", "Klausuren und Prüfungen", "termine"]],
  rezepte: [["rezepte-kochen", "Kochen"], ["rezepte-backen", "Backen"]],
  wunsch: [["wunsch-paul", "Paul"], ["wunsch-elina", "Elina"]],
};
const SEED_VERSION = 4;
const seedLists = () => Object.entries(SEED).flatMap(([sec, arr]) => arr.map(([id, name, type], i) => ({ id, name, order: i + 1, section: sec, ...(type ? { type } : {}) })));
// v3: aus der alten To-do-Liste "Schule" wird die Liste "Aufgaben" im Bereich Techniker Schule
const MIGRATE = { "todo-schule": { section: "schule", name: "Aufgaben", order: 1 } };
const MIGRATED_TO = { "schule-aufgaben": "todo-schule" };
// v4: eine schon selbst angelegte Prüfungsliste wird zur Termin-Liste, statt eine zweite anzulegen
const ADOPT = { "schule-pruefungen": l => (l.section || "shop") === "schule" && /klausur|prüfung|pruefung/i.test(l.name || "") };
let mode = "local";
function householdCode() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (/^[A-Za-z0-9]{20,64}$/.test(h)) { try { localStorage.setItem("einkauf.household", h); } catch (e) {} return h; }
  let c = null; try { c = localStorage.getItem("einkauf.household"); } catch (e) {}
  if (c) history.replaceState(null, "", "#" + c);
  return c;
}
function newCode() {
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  const r = crypto.getRandomValues(new Uint8Array(24));
  return Array.from(r, b => a[b % a.length]).join("");
}
function shareUrl() { return location.origin + location.pathname + location.hash; }
function renderSetup() {
  setStatus(false, "nicht verbunden");
  $("tabs").innerHTML = ""; $("addForm").hidden = true; $("sugg").hidden = true;
  $("main").innerHTML = `<div class="setup">
    <h2>Eure gemeinsame Einkaufsliste</h2>
    <p>Hast du einen Link bekommen? Dann öffne einfach diesen Link, und du bist sofort drin.</p>
    <p>Du richtest die Liste zum ersten Mal ein? Dann leg hier euren Haushalt an und schick den Link danach an alle, die mitmachen sollen.</p>
    <button class="btn primary" id="createHousehold">Haushalt anlegen</button>
  </div>`;
  $("createHousehold").onclick = () => { location.hash = newCode(); location.reload(); };
}
async function shareLink() {
  const url = shareUrl();
  if (navigator.share) { try { await navigator.share({ title: "Unser Haushalt", text: "Unsere gemeinsamen Einkaufslisten und To-Dos:", url }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(url); toast("Link kopiert. Schick ihn per WhatsApp."); }
  catch (e) { openSheet(`<h3>Link zur Liste</h3><p style="margin:0;color:var(--muted)">Wer diesen Link hat, kann mitschreiben. Gib ihn nur an Leute aus eurem Haushalt.</p><input id="linkBox" readonly value="${esc(url)}" style="border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)"><div class="btns"><span></span><button class="btn primary" data-close>Fertig</button></div>`); $("linkBox").select(); }
}
function askName(force) {
  if (state.me && !force) return;
  openSheet(`<h3>Wie heißt du?</h3>
    <p style="margin:0;color:var(--muted)">Dann sehen die anderen, wer was eingetragen hat.</p>
    <div class="field"><label for="meName">Vorname</label><input id="meName" value="${esc(state.me || "")}" placeholder="z. B. Paul"></div>
    <div class="btns"><button class="btn" data-close>Später</button><button class="btn primary" id="meSave">Speichern</button></div>`, () => {
    const save = () => { const n = $("meName").value.trim(); if (!n) return; state.me = n; try { localStorage.setItem("einkauf.name", n); } catch (e) {} closeSheet(); render(); };
    $("meSave").onclick = save; $("meName").onkeydown = e => { if (e.key === "Enter") save(); };
    $("meName").focus();
  });
}
async function startFirebase() {
  const code = householdCode();
  if (!code) { renderSetup(); return; }
  mode = "fb";
  try { state.me = localStorage.getItem("einkauf.name"); } catch (e) {}
  const V = "10.12.2";
  let F;
  try {
    const [appMod, fsMod] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
    ]);
    F = { ...appMod, ...fsMod };
  } catch (e) { setStatus(false, "keine Verbindung"); renderMessage("Keine Verbindung", "Die App konnte nicht geladen werden. Prüf das Internet und öffne die Seite neu."); return; }
  const app = F.initializeApp(FIREBASE_CONFIG);
  let fs;
  try { fs = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch (e) { fs = F.getFirestore(app); }
  const base = "h/" + code;
  const listsC = F.collection(fs, base + "/lists"), itemsC = F.collection(fs, base + "/items");
  const histD = F.doc(fs, base + "/meta/history"), infoD = F.doc(fs, base + "/meta/info");

  // Neuer Haushalt: Märkte einmalig anlegen (feste IDs, doppeltes Anlegen schadet nicht)
  // Neue Bereiche (v2: To-Dos) in bestehenden Haushalten nachrüsten
  F.getDoc(infoD).then(async s => {
    const v = s.exists() ? (s.data().v || 1) : 0;
    if (v >= SEED_VERSION) return;
    for (const [id, o] of Object.entries(MIGRATE)) { const r = F.doc(listsC, id); if ((await F.getDoc(r)).exists()) await F.updateDoc(r, o); }
    const all = (await F.getDocs(listsC)).docs.map(x => ({ id: x.id, ...x.data() }));
    for (const { id, ...o } of seedLists()) {
      const own = ADOPT[id] && all.find(ADOPT[id]);
      if (own) { if (own.id !== id) { await F.updateDoc(F.doc(listsC, own.id), { type: o.type }); continue; } }
      const ids = [id, MIGRATED_TO[id]].filter(Boolean);
      let has = false; for (const x of ids) if ((await F.getDoc(F.doc(listsC, x))).exists()) has = true;
      if (!has) await F.setDoc(F.doc(listsC, id), o);
    }
    await F.setDoc(infoD, { created: (s.exists() && s.data().created) || Date.now(), v: SEED_VERSION });
  }).catch(() => {});

  let seen = { l: false, i: false, h: false };
  const loadTimer = setTimeout(() => { if (!state.ready) { setStatus(false, "keine Verbindung"); renderMessage("Keine Verbindung", "Die Liste konnte nicht geladen werden. Prüf das Internet und öffne die Seite neu."); } }, 10000);
  const mark = (k) => { if (!seen[k]) { seen[k] = true; if (seen.l && seen.i && seen.h) { state.ready = true; clearTimeout(loadTimer); setTimeout(() => askName(false), 400); } } render(); };
  const onErr = e => { console.error(e); setStatus(false, e && e.code === "permission-denied" ? "kein Zugriff" : "getrennt"); if (e && e.code === "permission-denied") renderMessage("Kein Zugriff", "Der Link ist ungültig oder die Firebase-Regeln fehlen."); };
  F.onSnapshot(listsC, s => { state.lists = s.docs.map(d => ({ id: d.id, ...d.data() })); mark("l"); }, onErr);
  F.onSnapshot(itemsC, { includeMetadataChanges: true }, s => {
    setStatus(!s.metadata.fromCache, s.metadata.fromCache ? "offline, wird nachgeholt" : "live geteilt");
    state.items = s.docs.map(d => ({ id: d.id, ...d.data() })); mark("i");
  }, onErr);
  F.onSnapshot(histD, s => { state.history = (s.exists() && s.data().counts) || {}; mark("h"); }, onErr);

  // Offline: nicht auf den Server warten, Änderungen werden nachgereicht
  const fail = e => { console.error(e); toast("Das hat nicht geklappt. Versuch es noch mal."); };
  const bg = p => { p.catch(fail); return Promise.resolve(); };
  backend = {
    addList: o => bg(F.addDoc(listsC, o)),
    updateList: (id, o) => bg(F.updateDoc(F.doc(listsC, id), o)),
    deleteList: id => { bg(F.deleteDoc(F.doc(listsC, id))); for (const i of state.items.filter(i => i.list === id)) bg(F.deleteDoc(F.doc(itemsC, i.id))); return Promise.resolve(); },
    addItem: o => { const r = F.doc(itemsC); bg(F.setDoc(r, o)); return Promise.resolve(r.id); },
    updateItem: (id, o) => bg(F.updateDoc(F.doc(itemsC, id), o)),
    deleteItem: id => bg(F.deleteDoc(F.doc(itemsC, id))),
    setHistory: h => bg(F.setDoc(histD, { counts: h })),
  };
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent-ink)"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

function setStatus(live, text) { $("status").classList.toggle("live", live); $("statusText").textContent = text; }
function renderMessage(title, text) { $("main").innerHTML = `<div class="empty"><strong>${esc(title)}</strong>${esc(text)}</div>`; }

function sortedLists(sec = section) { return state.lists.filter(l => secOf(l) === sec).sort((a, b) => (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(b.name)); }

const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
function dueLabel(due) {
  if (!due) return null;
  const [y, m, d] = due.split("-").map(Number);
  const dt = new Date(y, m - 1, d), today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((dt - today) / 86400000);
  const txt = diff === 0 ? "heute" : diff === 1 ? "morgen" : diff === -1 ? "seit gestern" : diff < 0 ? `seit ${-diff} Tagen` : diff < 7 ? `bis ${WD[dt.getDay()]}` : `bis ${d}.${m}.`;
  return { txt, late: diff < 0 };
}
const MON = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const todayStr = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`; };
const isTermList = l => !!l && l.type === "termine";
function daysUntil(date) { const [y, m, d] = date.split("-").map(Number); const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((new Date(y, m - 1, d) - t) / 86400000); }
function untilText(n) { return n === 0 ? "heute" : n === 1 ? "morgen" : n === 2 ? "übermorgen" : n > 0 ? (n < 21 ? `in ${n} Tagen` : `in ${Math.round(n / 7)} Wochen`) : n === -1 ? "gestern" : `vor ${-n} Tagen`; }
function isOpenItem(i) { const l = state.lists.find(x => x.id === i.list); return isTermList(l) ? !!i.due && i.due >= todayStr() : !i.done; }
function openCount(sec) { const ids = new Set(sortedLists(sec).map(l => l.id)); return state.items.filter(i => ids.has(i.list) && isOpenItem(i)).length; }
function ago(ts) {
  if (!ts) return "";
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "gerade";
  if (m < 60) return `vor ${m} Min.`;
  const h = Math.round(m / 60);
  if (h < 24) return `vor ${h} Std.`;
  const d = Math.round(h / 24);
  return d === 1 ? "gestern" : `vor ${d} Tagen`;
}

async function addEntry(raw) {
  const cur = activeList(); if (!cur || !raw.trim()) return;
  const k = kind();
  if (isTermList(cur)) { const text = raw.trim(); editTermin({ list: cur.id, text: text.charAt(0).toUpperCase() + text.slice(1) }); return; }
  if (k === "recipe") { const text = raw.trim(); editRecipe({ list: cur.id, text: text.charAt(0).toUpperCase() + text.slice(1) }); return; }
  if (k !== "shop") {
    for (const p of raw.split(/[;\n]+/).map(s => s.trim()).filter(Boolean)) {
      const text = p.charAt(0).toUpperCase() + p.slice(1);
      const existing = state.items.find(i => i.list === cur.id && !i.done && keyOf(i.text) === keyOf(text));
      if (existing) { flashId = existing.id; toast(`${text} steht schon drauf.`); render(); continue; }
      await backend.addItem(k === "wish"
        ? { list: cur.id, text, note: "", price: "", link: "", done: false, at: Date.now(), by: state.me || null }
        : { list: cur.id, text, note: "", due: "", done: false, at: Date.now(), by: state.me || null });
    }
    return;
  }
  return addShopItems(cur.id, raw.split(/[,;\n]+/).map(s => s.trim()).filter(Boolean));
}
async function addShopItems(listId, parts) {
  const hist = { ...state.history };
  let added = 0;
  for (const p of parts) {
    const { text, qty } = parseEntry(p);
    const k = keyOf(text);
    const existing = state.items.find(i => i.list === listId && keyOf(i.text) === k);
    if (existing && !existing.done) { flashId = existing.id; toast(`${text} steht schon drauf.`); render(); continue; }
    const cat = (hist[k] && hist[k].cat) || guessCat(text);
    if (existing && existing.done) {
      await backend.updateItem(existing.id, { done: false, doneAt: null, qty: qty || existing.qty || "", at: Date.now(), by: state.me || null });
    } else {
      await backend.addItem({ list: listId, text, qty, cat, note: "", done: false, at: Date.now(), by: state.me || null });
    }
    added++;
    hist[k] = { text, cat, n: ((hist[k] && hist[k].n) || 0) + 1, list: listId };
  }
  backend.setHistory(trimHistory(hist));
  return added;
}
function trimHistory(h) {
  const e = Object.entries(h).sort((a, b) => b[1].n - a[1].n).slice(0, 300);
  return Object.fromEntries(e);
}

  const i = state.items.find(x => x.id === id); if (!i) return;

function editRecipe(r) {
  const isNew = !r.id;
  const ls = sortedLists("rezepte");
  openSheet(`
    <h3>${isNew ? "Neues Rezept" : "Rezept bearbeiten"}</h3>
    <div class="field"><label for="rText">Name</label><input id="rText" value="${esc(r.text)}"></div>
    <div class="row2">
      <div class="field"><label for="rServ">Portionen</label><input id="rServ" inputmode="numeric" value="${esc(r.servings)}" placeholder="z. B. 4"></div>
      <div class="field"><label for="rList">Kategorie</label><select id="rList">${ls.map(l => `<option value="${esc(l.id)}"${l.id === r.list ? " selected" : ""}>${esc(l.name)}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label for="rIng">Zutaten, eine pro Zeile</label><textarea id="rIng" placeholder="500 g Hackfleisch&#10;1 Zwiebel&#10;2 Dosen Tomaten">${esc(r.ingredients)}</textarea></div>
    <div class="field"><label for="rSteps">Zubereitung</label><textarea id="rSteps" style="min-height:150px" placeholder="1. Zwiebel würfeln und anbraten …">${esc(r.steps)}</textarea></div>
    <div class="field"><label for="rLink">Link zum Original</label><input id="rLink" type="url" inputmode="url" value="${esc(r.link)}" placeholder="https://…"></div>
    <div class="field"><label for="rNote">Notiz</label><input id="rNote" value="${esc(r.note)}" placeholder="z. B. Kinder mögen's, 30 Min."></div>
    <div class="btns">
      ${isNew ? "<span></span>" : `<button class="btn danger" id="rDel">Löschen</button>`}
      <span style="display:flex;gap:8px"><button class="btn" data-close>Abbrechen</button><button class="btn primary" id="rSave">Speichern</button></span>
    </div>`, () => {
    if (isNew) $("rIng").focus();
    $("rSave").onclick = async () => {
      const text = $("rText").value.trim(); if (!text) return;
      const o = { text, servings: $("rServ").value.trim(), list: $("rList").value, ingredients: $("rIng").value.trim(), steps: $("rSteps").value.trim(), link: $("rLink").value.trim(), note: $("rNote").value.trim() };
      if (isNew) { const id = await backend.addItem({ ...o, at: Date.now(), by: state.me || null }); closeSheet(); if (o.list !== activeBy.rezepte) setActive(o.list); if (id) viewRecipe(id); }
      else { await backend.updateItem(r.id, o); closeSheet(); viewRecipe(r.id); }
    };
    if (!isNew) $("rDel").onclick = () => {
      const copy = { ...r }; closeSheet(); backend.deleteItem(r.id);
      toast(`${r.text} gelöscht.`, "Rückgängig", () => { const { id: _, ...rest } = copy; backend.addItem(rest); });
    };
  });
}
function listSheet(l) {
  const isNew = !l;
  openSheet(`
    <h3>${isNew ? "Neue " + T().list : T().list + " bearbeiten"}</h3>
    <div class="field"><label for="lName">Name</label><input id="lName" value="${esc(l ? l.name : "")}" placeholder="${T().listPh}"></div>
    ${isTodo() ? `<div class="field"><label for="lType">Art</label><select id="lType"><option value="aufgaben">Aufgaben zum Abhaken</option><option value="termine"${isTermList(l) ? " selected" : ""}>Termine mit Datum (z. B. Prüfungen)</option></select></div>` : ""}
    <div class="btns">
      ${isNew ? "<span></span>" : `<button class="btn danger" id="lDel">${T().list} löschen</button>`}
      <span style="display:flex;gap:8px"><button class="btn" data-close>Abbrechen</button><button class="btn primary" id="lSave">${isNew ? "Anlegen" : "Speichern"}</button></span>
    </div>
    <div id="lConfirm"></div>`, () => {
    $("lName").focus();
    const save = async () => {
      const name = $("lName").value.trim(); if (!name) return;
      if (isNew) {
        const order = Math.max(0, ...sortedLists().map(x => x.order || 0)) + 1;
        await backend.addList({ name, order, section, ...($("lType") ? { type: $("lType").value } : {}) });
        const nl = sortedLists().find(x => x.name === name); if (nl) setActive(nl.id);
      } else await backend.updateList(l.id, { name, ...($("lType") ? { type: $("lType").value } : {}) });
      closeSheet();
    };
    $("lSave").onclick = save;
    $("lName").onkeydown = e => { if (e.key === "Enter") save(); };
    if (!isNew) $("lDel").onclick = () => {
      const n = state.items.filter(i => i.list === l.id).length;
      $("lConfirm").innerHTML = `<p style="margin:4px 0;color:var(--danger)">„${esc(l.name)}“ ${n ? `und ${n} Einträge ` : ""}endgültig löschen?</p><button class="btn danger" id="lDel2">Ja, löschen</button>`;
      $("lDel2").onclick = async () => { closeSheet(); await backend.deleteList(l.id); delete activeBy[section]; render(); };
    };
  });
}
function remember() { try { localStorage.setItem("einkauf.section", section); localStorage.setItem("einkauf.activeBy", JSON.stringify(activeBy)); } catch (e) {} }
function setActive(id) { activeBy[section] = id; remember(); render(); window.scrollTo({ top: 0 }); }
function setSection(sec) { if (sec === section) return; section = sec; $("addInput").value = ""; remember(); render(); window.scrollTo({ top: 0 }); }

let toastTimer;
function toast(msg, actLabel, act) {
  clearTimeout(toastTimer);
  $("toastHost").innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${actLabel ? `<button id="toastAct">${esc(actLabel)}</button>` : ""}</div>`;
  if (actLabel) $("toastAct").onclick = () => { $("toastHost").innerHTML = ""; act(); };
  toastTimer = setTimeout(() => { $("toastHost").innerHTML = ""; }, actLabel ? 6000 : 2600);
}

// ---------- Events ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.section) setSection(t.dataset.section);
  else if (t.dataset.list) setActive(t.dataset.list);
  else if (t.dataset.recipe) viewRecipe(t.dataset.recipe);
  else if (t.dataset.term) { const i = state.items.find(x => x.id === t.dataset.term); if (i) editTermin(i); }
  else if (t.id === "clearPast") clearPast();
  else if (t.id === "toggleDone") { doneOpen = !doneOpen; render(); }
  else if (t.id === "newList") listSheet(null);
  else if (t.id === "editList") listSheet(activeList());
  else if (t.dataset.toggle) toggle(t.dataset.toggle);
  else if (t.dataset.edit) editItem(t.dataset.edit);
  else if (t.id === "clearDone") clearDone();
  else if (t.id === "copyList") copyList();
  else if (t.id === "shareLink") shareLink();
  else if (t.id === "changeName") askName(true);
  else if (t.dataset.sugg) { addEntry(t.dataset.sugg); $("addInput").value = ""; renderSugg(); }
});
$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("addInput").value; $("addInput").value = "";
  addEntry(v); renderSugg();
});
$("addInput").addEventListener("input", renderSugg);
setInterval(() => { if (state.ready && !$("sheetHost").innerHTML) render(); }, 60000);

// ---------- Start ----------
window.addEventListener("hashchange", () => { if (mode === "fb" || FIREBASE_CONFIG) location.reload(); });
(async () => {
  const inArtifact = !!(window.claude && window.claude.use);
  if (!inArtifact && FIREBASE_CONFIG) { await startFirebase(); return; }
  const db = inArtifact ? await window.claude.use("db").catch(() => null) : null;
  if (db) {
    backend = dbBackend(db);
    try {
      userCap = await window.claude.use("user");
      if (userCap) { state.me = await userCap.id(); render(); }
    } catch (e) {}
  } else {
    backend = localBackend();
  }
})();
</script>
</body>
</html>
