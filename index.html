<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!--APP-START-->
<title>Paulimania</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a matchday sheet; pitch-green header band, two team columns side by side on wide screens. */
:root {
  --bg: #eef2ec;
  --surface: #ffffff;
  --ink: #142019;
  --muted: #5a6a60;
  --line: #d3dcd3;
  --pitch: #1d6b3d;
  --pitch-ink: #f4f8f2;
  --accent: #1d6b3d;
  --accent-soft: #dcebdf;
  --team-a: #d48a12;
  --team-a-soft: #fbefd9;
  --team-b: #2f4ea8;
  --team-b-soft: #e1e7f7;
  --warn: #b5541c;
  --warn-soft: #f8e4d6;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1612; --surface: #18221c; --ink: #e6ede7; --muted: #95a69a; --line: #2b3a31;
    --pitch: #174f2f; --pitch-ink: #eef5ef; --accent: #5cc283; --accent-soft: #1f3a29;
    --team-a: #f0a93a; --team-a-soft: #3a2c14; --team-b: #7d97ea; --team-b-soft: #1e2744;
    --warn: #f08a52; --warn-soft: #3d2416; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1612; --surface: #18221c; --ink: #e6ede7; --muted: #95a69a; --line: #2b3a31;
  --pitch: #174f2f; --pitch-ink: #eef5ef; --accent: #5cc283; --accent-soft: #1f3a29;
  --team-a: #f0a93a; --team-a-soft: #3a2c14; --team-b: #7d97ea; --team-b-soft: #1e2744;
  --warn: #f08a52; --warn-soft: #3d2416; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* Header band */
.band { background: var(--pitch); color: var(--pitch-ink); position: relative; overflow: hidden; }
.band::after {
  content: ""; position: absolute; right: -60px; top: 50%; width: 180px; height: 180px;
  border: 2px solid color-mix(in srgb, var(--pitch-ink) 25%, transparent); border-radius: 50%;
  transform: translateY(-50%); pointer-events: none;
}
.band::before {
  content: ""; position: absolute; right: 29px; top: 0; bottom: 0; width: 2px;
  background: color-mix(in srgb, var(--pitch-ink) 25%, transparent); pointer-events: none;
}
.band .wrap { padding-block: 18px 0; position: relative; z-index: 1; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 {
  font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: .5px;
  margin: 0; text-transform: uppercase; line-height: 1;
}
.brand span { font-size: 14px; opacity: .8; }
nav.tabs { display: flex; gap: 4px; margin-top: 14px; overflow-x: auto; }
nav.tabs button {
  border: 0; background: transparent; color: var(--pitch-ink); opacity: .75;
  font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .6px;
  text-transform: uppercase; padding: 8px 14px 10px; cursor: pointer; border-radius: 8px 8px 0 0;
}
nav.tabs button[aria-selected="true"] { background: var(--bg); color: var(--ink); opacity: 1; }
nav.tabs button:focus-visible { outline: 2px solid var(--pitch-ink); outline-offset: -2px; }

main .wrap { padding-block: 20px 60px; display: grid; gap: 20px; }
h2 {
  font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0;
  text-transform: uppercase; letter-spacing: .5px; text-wrap: balance;
}
h3 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0; letter-spacing: .4px; text-transform: uppercase; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; min-width: 0; }

/* Buttons */
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 9px;
  cursor: pointer; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--warn); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="text"], input[type="date"], input[type="number"], select, textarea {
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; min-width: 0;
}

/* Counter */
.counter { display: flex; align-items: baseline; gap: 6px; font-family: var(--font-display); }
.counter b { font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.counter span { font-size: 20px; color: var(--muted); }
.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.meter.over i { background: var(--warn); }

/* Chips */
.chip { font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.plain { background: var(--bg); color: var(--muted); }
.pos { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .5px; color: var(--muted); min-width: 56px; flex: none; }
.posgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .posgrid { grid-template-columns: 1fr; } }
.posname { text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 600; }
.pospick { display: grid; gap: 6px; }
.posline { display: grid; grid-template-columns: 72px 1fr; gap: 6px; align-items: center; }
.posline-l { font-size: 13px; color: var(--muted); }
.posline .seg button { min-width: 44px; padding: 7px 6px; font-family: var(--font-display); letter-spacing: .4px; font-size: 15px; }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.pos small { font-size: 11px; opacity: .7; font-weight: 600; }

/* Attendance list */
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.pick {
  display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; user-select: none; min-width: 0;
}
.pick input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.pick .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.pick.on { border-color: var(--accent); background: var(--accent-soft); }

/* Teams */
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .teams { grid-template-columns: 1fr; } }
.team { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; min-width: 0; }
.team header { padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-top: 5px solid var(--tc); background: var(--tcs); }
.team.a { --tc: var(--team-a); --tcs: var(--team-a-soft); }
.team.b { --tc: var(--team-b); --tcs: var(--team-b-soft); }
.team header h3 { color: var(--ink); }
.team .stat { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.team ol { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
.team li button {
  width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid transparent;
  background: transparent; padding: 7px 8px; border-radius: 8px; cursor: pointer;
}
.team li button:hover { background: var(--bg); }
.team li button.sel { border-color: var(--tc); background: var(--tcs); }
.team li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skill { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); font-size: 14px; }
.posbar { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 14px 12px; font-size: 13px; color: var(--muted); }
.balance { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
.balance b { font-variant-numeric: tabular-nums; }
.hint { font-size: 14px; color: var(--muted); }

/* Tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--bg); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.dots i.on { background: var(--accent); }

/* Editor */
.editor { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .editor { grid-template-columns: 1fr; } }
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--bg); padding: 7px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.scale button { padding: 7px 0; font-variant-numeric: tabular-nums; }

/* Rating editor */
.attrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
@media (max-width: 400px) { .attrs { grid-template-columns: 1fr; } }
.attr { display: grid; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); min-width: 0; }
.attr.dim { opacity: .7; }
.attr-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.attr-val { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.attr .seg button { background: var(--surface); padding: 6px 0; }
.attr .seg button[aria-pressed="true"] { background: var(--accent); }
.check { display: flex; gap: 8px; align-items: flex-start; }
.check input { flex: none; margin-top: 3px; }
.small-btn { padding: 5px 10px; font-size: 13px; }
.trend { font-size: 11px; }
.trend.up { color: var(--accent); }
.trend.down { color: var(--warn); }
/* Team comparison */
.cmp summary { font-size: 15px; }
.cmp-grid { display: grid; gap: 6px; margin-top: 10px; max-width: 560px; }
.cmp-row { display: grid; grid-template-columns: 34px 1fr 64px 1fr 34px; align-items: center; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.cmp-l { text-align: center; color: var(--muted); font-weight: 600; }
.cmp-v:last-child { text-align: right; }
.cmp-bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: flex; }
.cmp-bar.a { justify-content: flex-end; }
.cmp-bar.a i { background: var(--team-a); }
.cmp-bar.b i { background: var(--team-b); }
.cmp-bar i { display: block; height: 100%; }

/* History */
.game { display: grid; gap: 8px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.game:last-child { border-bottom: 0; }
.score { display: flex; align-items: center; gap: 6px; }
.score input { width: 56px; text-align: center; }
.empty { padding: 26px 16px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 15px;
  box-shadow: 0 6px 24px rgba(0,0,0,.2); z-index: 20; max-width: calc(100% - 32px);
}
textarea { width: 100%; min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
details summary { cursor: pointer; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="band">
  <div class="wrap">
    <div class="brand"><h1>Paulimania</h1><span>Montagskick · 11 gegen 11</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="spieltag" aria-selected="true">Spieltag</button>
      <button role="tab" data-tab="kader" aria-selected="false">Kader</button>
      <button role="tab" data-tab="verlauf" aria-selected="false">Verlauf</button>
    </nav>
  </div>
</div>

<main>
  <div class="wrap" id="view"></div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";

// Detailed positions, grouped into lines (Tor, Abwehr, Mittelfeld, Sturm) for balancing.
const POSITIONS = [
  { k: "TW", name: "Torwart", line: "TW" },
  { k: "LV", name: "Linker Verteidiger", line: "ABW" },
  { k: "IV", name: "Innenverteidiger", line: "ABW" },
  { k: "RV", name: "Rechter Verteidiger", line: "ABW" },
  { k: "LAV", name: "Linker Außenverteidiger, offensiv", line: "ABW" },
  { k: "RAV", name: "Rechter Außenverteidiger, offensiv", line: "ABW" },
  { k: "ZDM", name: "Defensives Mittelfeld", line: "MIT" },
  { k: "LM", name: "Linkes Mittelfeld", line: "MIT" },
  { k: "ZM", name: "Zentrales Mittelfeld", line: "MIT" },
  { k: "RM", name: "Rechtes Mittelfeld", line: "MIT" },
  { k: "ZOM", name: "Offensives Mittelfeld", line: "MIT" },
  { k: "LF", name: "Linker Flügelstürmer", line: "STU" },
  { k: "MS", name: "Mittelstürmer, hängende Spitze", line: "STU" },
  { k: "ST", name: "Stürmer", line: "STU" },
  { k: "RF", name: "Rechter Flügelstürmer", line: "STU" },
];
const LINES = { TW: "Tor", ABW: "Abwehr", MIT: "Mittelfeld", STU: "Sturm" };
const LINE_ORDER = ["TW", "ABW", "MIT", "STU"];
const POS_ORDER = POSITIONS.map(x => x.k);
const POS = Object.fromEntries(POSITIONS.map(x => [x.k, x.name]));
const LINE_OF = Object.fromEntries(POSITIONS.map(x => [x.k, x.line]));
// Players saved before detailed positions existed
const LEGACY_POS = { ABW: "IV", MIT: "ZM", STU: "ST" };
function normPlayer(p) {
  if (!p) return p;
  const q = { ...p };
  if (LEGACY_POS[q.pos]) q.pos = LEGACY_POS[q.pos];
  if (!POS[q.pos]) q.pos = "ZM";
  if (LEGACY_POS[q.pos2]) q.pos2 = LEGACY_POS[q.pos2];
  if (q.pos2 && (!POS[q.pos2] || q.pos2 === q.pos)) q.pos2 = "";
  return q;
}
function normAll(players) { return Object.fromEntries(Object.entries(players || {}).map(([k, v]) => [k, normPlayer(v)])); }
// Rating criteria. w = weight in a field player's overall rating.
const ATTRS = [
  { k: "kon", name: "Kondition", short: "Kondi", hint: "Hält er das ganze Spiel durch, läuft er viel?", w: 1.1 },
  { k: "tem", name: "Tempo", short: "Tempo", hint: "Antritt und Endgeschwindigkeit", w: 1.0 },
  { k: "bal", name: "Ballbehandlung", short: "Ball", hint: "Annahme, Dribbling, behauptet er den Ball?", w: 1.2 },
  { k: "pas", name: "Passspiel", short: "Pass", hint: "Kommen kurze und lange Pässe an?", w: 1.0 },
  { k: "spv", name: "Spielverständnis", short: "Spielv.", hint: "Stellungsspiel, Übersicht, gute Entscheidungen", w: 1.3 },
  { k: "zwk", name: "Zweikampfverhalten", short: "Zweik.", hint: "Tackling, Kopfball, Körpereinsatz, gewinnt er Duelle?", w: 1.1 },
  { k: "abs", name: "Abschluss", short: "Abschl.", hint: "Torgefahr und Schusstechnik", w: 0.9 },
  { k: "erf", name: "Erfahrung & Sicherheit", short: "Erfahr.", hint: "Ruhe am Ball, macht wenig Fehler", w: 0.8 },
  { k: "tor", name: "Torwartspiel", short: "Torwart", hint: "Reflexe, Fangen, Strafraum. Bei Feldspielern: taugt er als Ersatz-Torwart?", w: 0 },
];
const FIELD_ATTRS = ATTRS.filter(a => a.w > 0);
function attrsOf(p) {
  const base = p.skill || 5, out = {};
  for (const a of ATTRS) out[a.k] = (p.attrs && p.attrs[a.k]) || (a.k === "tor" ? (p.pos === "TW" ? base : 2) : base);
  return out;
}
// Overall rating 1-10. Keepers count mostly by their goalkeeping.
function ovr(p) {
  if (!p) return 5;
  const at = attrsOf(p);
  const wsum = FIELD_ATTRS.reduce((s, a) => s + a.w, 0);
  const field = FIELD_ATTRS.reduce((s, a) => s + a.w * at[a.k], 0) / wsum;
  const v = p.pos === "TW" ? 0.65 * at.tor + 0.35 * field : field;
  return Math.round(v * 10) / 10;
}
function posPicker(attr, val, exclude) {
  const rows = LINE_ORDER.map(line => `<div class="posline"><span class="posline-l">${LINES[line]}</span><div class="seg">${
    POSITIONS.filter(x => x.line === line).map(x => `<button data-${attr}="${x.k}" aria-pressed="${val === x.k}" title="${x.name}" ${x.k === exclude ? "disabled" : ""}>${x.k}</button>`).join("")}</div></div>`).join("");
  const none = exclude !== null ? `<div class="posline"><span class="posline-l"></span><div class="seg"><button data-${attr}="" aria-pressed="${!val}">Keine</button></div></div>` : "";
  return `<div class="pospick">${none}${rows}</div>`;
}
function posHtml(p) { return `<span class="pos">${p.pos}${p.pos2 ? `<small>/${p.pos2}</small>` : ""}</span>`; }
function f1(n) { return (Math.round(n * 10) / 10).toFixed(1).replace(".", ","); }
function today() { return new Date().toISOString().slice(0, 10); }
const TARGET = 22;
const LS_KEY = "paulimania-v1";

const state = {
  tab: "spieltag",
  players: {},   // id -> {id, name, skill 1-10, pos, active, demo}
  games: {},     // id -> {id, date, a:[ids], b:[ids], scoreA, scoreB}
  current: { date: nextMonday(), selected: [], a: null, b: null },
  editing: null, // player id or "new"
  swapSel: null,
  filter: "",
  mode: "local",
  loaded: false,
};

/* ---------- helpers ---------- */
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function nextMonday(from) {
  const d = from ? new Date(from) : new Date();
  const day = d.getDay();
  const add = (8 - day) % 7; // Monday = 1; today counts if Monday
  d.setDate(d.getDate() + add);
  return d.toISOString().slice(0, 10);
}
function fmtDate(iso) {
  if (!iso) return "–";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "numeric", year: "2-digit" });
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function sortedGames() { return Object.values(state.games).sort((x, y) => y.date.localeCompare(x.date)); }
function lastGame() { return sortedGames()[0] || null; }
function playerList() { return Object.values(state.players).sort((x, y) => x.name.localeCompare(y.name, "de")); }
function P(id) { return state.players[id]; }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2200);
}

/* ---------- storage: shared database when available, else this browser ---------- */
let db = null;
const store = {
  saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ players: state.players, games: state.games, current: state.current })); } catch (e) {}
  },
  loadLocal() {
    try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); Object.assign(state, { players: normAll(d.players), games: d.games || {}, current: Object.assign(state.current, d.current || {}) }); } } catch (e) {}
  },
  async putPlayer(p) { state.players[p.id] = p; if (db) await dbWrite(db.collection("players").doc(p.id).set(p)); else this.saveLocal(); },
  async delPlayer(id) { delete state.players[id]; if (db) await dbWrite(db.collection("players").doc(id).delete()); else this.saveLocal(); },
  async putGame(g) { state.games[g.id] = g; if (db) await dbWrite(db.collection("games").doc(g.id).set(g)); else this.saveLocal(); },
  async delGame(id) { delete state.games[id]; if (db) await dbWrite(db.collection("games").doc(id).delete()); else this.saveLocal(); },
  saveCurrent: debounce(async () => {
    if (db) await dbWrite(db.doc("meta/current").set(JSON.parse(JSON.stringify(state.current))));
    else store.saveLocal();
  }, 600),
};
async function dbWrite(p) {
  try { await p; } catch (e) { toast(e && e.code === "quota_exceeded" ? "Speicher voll: alte Spieltage löschen." : "Speichern fehlgeschlagen. Verbindung prüfen."); }
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

async function initDb() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  let d = null;
  try { d = await window.claude.use("db"); } catch (e) { d = null; }
  if (!d) return;
  db = d; state.mode = "db";
  const seen = { players: false, games: false, current: false };
  const timer = setTimeout(() => { if (!state.loaded) { state.loaded = true; render(); } }, 10000);
  const done = (k) => { seen[k] = true; if (seen.players && seen.games && seen.current) { state.loaded = true; clearTimeout(timer); } render(); };
  db.collection("players").onSnapshot(s => {
    state.players = Object.fromEntries(s.docs.map(x => [x.id, normPlayer({ ...x.data(), id: x.id })])); done("players");
  }, () => done("players"));
  db.collection("games").onSnapshot(s => {
    state.games = Object.fromEntries(s.docs.map(x => [x.id, { ...x.data(), id: x.id }])); done("games");
  }, () => done("games"));
  db.doc("meta/current").onSnapshot(s => {
    if (s.exists && !s.metadata.hasPendingWrites) state.current = Object.assign({ date: nextMonday(), selected: [], a: null, b: null }, JSON.parse(JSON.stringify(s.data())));
    done("current");
  }, () => done("current"));
}

/* ---------- team balancing ---------- */
// Cost of a split: strength gap, position imbalance (goalkeepers count most),
// and a small penalty for pairs who were teammates last week (more variety).
function makeScorer(ids) {
  const lg = lastGame();
  const lastTeam = {};
  if (lg) { lg.a.forEach(id => lastTeam[id] = "a"); lg.b.forEach(id => lastTeam[id] = "b"); }
  const cache = {};
  for (const id of ids) { const p = P(id); cache[id] = { o: ovr(p), at: attrsOf(p || {}) }; }
  return (a, b) => {
    const sum = t => t.reduce((s, id) => s + cache[id].o, 0);
    let cost = Math.abs(sum(a) - sum(b)) * 3;
    // also balance each criterion, so one team isn't all runners and the other all technicians
    for (const at of FIELD_ATTRS) {
      const sa = a.reduce((s, id) => s + cache[id].at[at.k], 0), sb = b.reduce((s, id) => s + cache[id].at[at.k], 0);
      cost += Math.abs(sa - sb) * 0.25;
    }
    // position coverage: main position counts 1, secondary position 0.5
    const cov = (t, pos) => t.reduce((s, id) => { const p = P(id); return s + (p?.pos === pos ? 1 : p?.pos2 === pos ? 0.5 : 0); }, 0);
    for (const pos of POS_ORDER) cost += Math.abs(cov(a, pos) - cov(b, pos)) * (pos === "TW" ? 12 : 0.6);
    // and per line (Abwehr, Mittelfeld, Sturm)
    const covL = (t, line) => t.reduce((s, id) => { const p = P(id); return s + (LINE_OF[p?.pos] === line ? 1 : LINE_OF[p?.pos2] === line ? 0.5 : 0); }, 0);
    for (const line of LINE_ORDER) if (line !== "TW") cost += Math.abs(covL(a, line) - covL(b, line)) * 2;
    const together = t => { let n = 0; for (let i = 0; i < t.length; i++) for (let j = i + 1; j < t.length; j++) { const x = lastTeam[t[i]], y = lastTeam[t[j]]; if (x && x === y) n++; } return n; };
    cost += (together(a) + together(b)) * 0.15;
    return cost;
  };
}
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildTeams(ids) {
  const score = makeScorer(ids);
  const half = Math.ceil(ids.length / 2);
  const found = new Map();
  for (let r = 0; r < 150; r++) {
    const s = shuffle(ids);
    let a = s.slice(0, half), b = s.slice(half);
    let best = score(a, b), improved = true;
    while (improved) {
      improved = false;
      for (let i = 0; i < a.length && !improved; i++) for (let j = 0; j < b.length; j++) {
        const na = a.slice(), nb = b.slice(); [na[i], nb[j]] = [nb[j], na[i]];
        const c = score(na, nb);
        if (c < best - 1e-9) { a = na; b = nb; best = c; improved = true; break; }
      }
    }
    const key = a.slice().sort().join(",");
    if (!found.has(key)) found.set(key, { a, b, cost: best });
  }
  const all = [...found.values()].sort((x, y) => x.cost - y.cost);
  const top = all.filter(x => x.cost <= all[0].cost + 1.5).slice(0, 8);
  const pick = top[Math.floor(Math.random() * top.length)];
  return { a: pick.a, b: pick.b };
}
function teamStats(t) {
  const ps = t.map(P).filter(Boolean);
  const sum = ps.reduce((s, p) => s + ovr(p), 0);
  const byPos = Object.fromEntries(LINE_ORDER.map(k => [k, ps.filter(p => LINE_OF[p.pos] === k).length]));
  const attrAvg = Object.fromEntries(FIELD_ATTRS.map(a => [a.k, ps.length ? ps.reduce((s, p) => s + attrsOf(p)[a.k], 0) / ps.length : 0]));
  return { n: ps.length, sum, avg: ps.length ? sum / ps.length : 0, byPos, attrAvg };
}
function sortTeam(t) {
  return t.slice().sort((x, y) => POS_ORDER.indexOf(P(x)?.pos) - POS_ORDER.indexOf(P(y)?.pos) || (P(x)?.name || "").localeCompare(P(y)?.name || "", "de"));
}

/* ---------- attendance stats ---------- */
function playerStats() {
  const games = sortedGames();
  const recent = games.slice(0, 8);
  const res = {};
  for (const p of Object.values(state.players)) res[p.id] = { total: 0, recent: recent.map(() => false), last: null, w: 0, d: 0, l: 0 };
  games.forEach((g) => {
    const has = typeof g.scoreA === "number" && typeof g.scoreB === "number";
    for (const [side, ids] of [["a", g.a], ["b", g.b]]) for (const id of ids) {
      const r = res[id]; if (!r) continue;
      r.total++; if (!r.last) r.last = g.date;
      if (has) { const my = side === "a" ? g.scoreA : g.scoreB, op = side === "a" ? g.scoreB : g.scoreA; if (my > op) r.w++; else if (my < op) r.l++; else r.d++; }
    }
  });
  recent.forEach((g, i) => { for (const id of [...g.a, ...g.b]) if (res[id]) res[id].recent[i] = true; });
  return res;
}
function trend(p) {
  const h = p.history || [];
  if (h.length < 2) return 0;
  const d = h[h.length - 1].ovr - h[h.length - 2].ovr;
  return Math.abs(d) < 0.05 ? 0 : d;
}
function statusOf(p, st, lg) {
  if (lg && (lg.a.includes(p.id) || lg.b.includes(p.id))) return { label: "Vorrecht", cls: "" };
  if (!st.total) return { label: "Neu", cls: "plain" };
  const weeks = st.last ? Math.floor((Date.now() - new Date(st.last + "T12:00:00")) / 6048e5) : 99;
  if (weeks >= 4) return { label: `${weeks} Wo. weg`, cls: "warn" };
  return { label: "Ersatz", cls: "plain" };
}

/* ---------- rendering ---------- */
const view = document.getElementById("view");
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  if (state.mode === "db" && !state.loaded) { view.innerHTML = `<div class="panel empty"><p class="muted">Kader wird geladen …</p></div>`; return; }
  if (state.tab === "spieltag") renderMatchday();
  else if (state.tab === "kader") renderSquad();
  else renderHistory();
}

function emptySquad() {
  return `<div class="panel empty">
    <h2>Noch keine Spieler</h2>
    <p class="muted" style="max-width:46ch">Lege eure Spieler im Kader an, mit Position und Stärke von 1 bis 10. Danach kreuzt du hier an, wer am Montag dabei ist, und lässt faire Teams bauen.</p>
    <div class="row" style="justify-content:center">
      <button class="btn primary" data-act="goto-new">Ersten Spieler anlegen</button>
      <button class="btn" data-act="demo">Beispielkader zum Testen laden</button>
    </div>
  </div>`;
}

function renderMatchday() {
  const players = playerList().filter(p => p.active !== false);
  if (!Object.keys(state.players).length) { view.innerHTML = emptySquad(); return; }
  const cur = state.current;
  const sel = new Set(cur.selected.filter(id => state.players[id]));
  const lg = lastGame();
  const n = sel.size;
  const q = state.filter.trim().toLowerCase();
  const shown = players.filter(p => !q || p.name.toLowerCase().includes(q));
  const lgIds = lg ? new Set([...lg.a, ...lg.b]) : new Set();
  const groups = [
    ["Vorrecht (letzte Woche dabei)", shown.filter(p => lgIds.has(p.id))],
    [lg ? "Weitere Spieler" : "Alle Spieler", shown.filter(p => !lgIds.has(p.id))],
  ].filter(g => g[1].length);
  const pct = Math.min(100, (n / TARGET) * 100);
  const gk = [...sel].filter(id => P(id)?.pos === "TW").length;
  const gk2 = [...sel].filter(id => P(id)?.pos2 === "TW").length;

  let html = `
  <section class="panel">
    <div class="row spread">
      <div style="display:grid;gap:4px">
        <h2>Spieltag</h2>
        <div class="row small"><label for="gdate" class="muted">Datum</label><input type="date" id="gdate" value="${esc(cur.date)}"></div>
      </div>
      <div style="display:grid;gap:6px;min-width:150px">
        <div class="counter"><b>${n}</b><span>/ ${TARGET} dabei</span></div>
        <div class="meter ${n > TARGET ? "over" : ""}"><i style="width:${pct}%"></i></div>
      </div>
    </div>
    <div class="row small">
      ${n > TARGET ? `<span class="chip warn">${n - TARGET} zu viel</span>` : n < TARGET ? `<span class="chip plain">${TARGET - n} Plätze frei</span>` : `<span class="chip">Voll</span>`}
      <span class="chip ${gk < 2 ? "warn" : ""}">${gk} Torwart${gk === 1 ? "" : "e"}</span>${gk2 ? `<span class="chip plain">${gk2} kann notfalls ins Tor</span>` : ""}
    </div>
    <div class="filters">
      <input type="text" id="filter" placeholder="Spieler suchen" value="${esc(state.filter)}" style="flex:1;min-width:160px">
      ${lg ? `<button class="btn" data-act="sel-last">Alle von letzter Woche</button>` : ""}
      <button class="btn ghost" data-act="sel-none">Auswahl leeren</button>
    </div>`;
  for (const [title, list] of groups) {
    html += `<div style="display:grid;gap:8px"><h3 class="muted">${title}</h3><div class="plist">` +
      list.map(p => `<label class="pick ${sel.has(p.id) ? "on" : ""}">
        <input type="checkbox" data-pick="${p.id}" ${sel.has(p.id) ? "checked" : ""}>
        ${posHtml(p)}<span class="nm">${esc(p.name)}</span>
      </label>`).join("") + `</div></div>`;
  }
  if (!shown.length) html += `<p class="muted">Kein Spieler passt zu „${esc(state.filter)}“.</p>`;
  html += `<div class="row"><button class="btn primary" data-act="build" ${n < 2 ? "disabled" : ""}>${cur.a ? "Neu mischen" : "Faire Teams erstellen"}</button>
    ${n % 2 ? `<span class="hint">Ungerade Zahl: ein Team hat einen Spieler mehr.</span>` : ""}</div>
  </section>`;

  if (cur.a && cur.b) html += renderTeams();
  view.innerHTML = html;
}

function renderTeams() {
  const cur = state.current;
  const A = teamStats(cur.a), B = teamStats(cur.b);
  const diff = Math.round(Math.abs(A.sum - B.sum) * 10) / 10;
  const cmp = FIELD_ATTRS.map(at => { const va = A.attrAvg[at.k], vb = B.attrAvg[at.k]; return `
    <div class="cmp-row"><span class="cmp-v">${f1(va)}</span>
      <div class="cmp-bar a"><i style="width:${va * 10}%"></i></div>
      <span class="cmp-l">${at.short}</span>
      <div class="cmp-bar b"><i style="width:${vb * 10}%"></i></div>
      <span class="cmp-v">${f1(vb)}</span></div>`; }).join("");
  const missing = [...cur.selected].filter(id => state.players[id] && !cur.a.includes(id) && !cur.b.includes(id));
  const stale = cur.a.length + cur.b.length !== cur.selected.filter(id => state.players[id]).length || missing.length;
  const team = (key, title, t, st) => `
    <div class="team ${key}">
      <header><h3>${title}</h3><span class="stat">${st.n} Spieler · Ø ${f1(st.avg)}</span></header>
      <ol>${sortTeam(t).map(id => { const p = P(id); if (!p) return ""; return `<li><button data-swap="${id}" class="${state.swapSel === id ? "sel" : ""}">
        ${posHtml(p)}<span class="nm">${esc(p.name)}</span><span class="skill">${f1(ovr(p))}</span></button></li>`; }).join("")}</ol>
      <div class="posbar">${LINE_ORDER.map(k => `<span>${LINES[k]} ${st.byPos[k]}</span>`).join("")}</div>
    </div>`;
  return `
  <section class="panel">
    <div class="row spread">
      <h2>Teams</h2>
      <div class="balance"><span>Stärke <b>${f1(A.sum)}</b> : <b>${f1(B.sum)}</b></span>
        <span class="chip ${diff > 3 ? "warn" : ""}">${diff < 0.05 ? "Exakt ausgeglichen" : `Differenz ${f1(diff)}`}</span></div>
    </div>
    ${stale ? `<p class="chip warn" style="justify-self:start">Auswahl hat sich geändert. „Neu mischen“ drücken.</p>` : ""}
    <div class="teams">${team("a", "Team Gelb", cur.a, A)}${team("b", "Team Blau", cur.b, B)}</div>
    <details class="cmp"><summary>Vergleich nach Kriterien (Durchschnitt pro Team)</summary>
      <div class="cmp-grid">${cmp}</div></details>
    <p class="hint">Tausch von Hand: einen Spieler antippen, dann einen aus dem anderen Team. Die Stärkewerte sind nur für dich und kommen nicht in den WhatsApp-Text.</p>
    <div class="row">
      <button class="btn primary" data-act="copy">Für WhatsApp kopieren</button>
      <button class="btn" data-act="save-game">Spieltag speichern</button>
    </div>
    <textarea id="wa" readonly hidden></textarea>
  </section>`;
}

function renderSquad() {

    <p class="hint">„Vorrecht“ heißt: war beim letzten gespeicherten Spieltag dabei. Die Punkte zeigen die letzten 8 Spieltage, links ist der neueste. Bewertungen kannst du jederzeit über „Bearbeiten“ anpassen. Der Pfeil zeigt, ob sich die Stärke seit der letzten Bewertung verändert hat.</p>

        <input type="number" min="0" inputmode="numeric" id="sb-${g.id}" data-score="${g.id}" data-side="b" value="${g.scoreB ?? ""}" aria-label="Tore Blau">
        <span class="chip" style="background:var(--team-b-soft);color:var(--team-b)">Blau</span></div></div>
      <div class="small muted"><b style="color:var(--team-a)">Gelb:</b> ${g.a.map(id => esc(P(id)?.name || "?")).join(", ")}</div>
      <div class="small muted"><b style="color:var(--team-b)">Blau:</b> ${g.b.map(id => esc(P(id)?.name || "?")).join(", ")}</div>
      <div><button class="btn ghost danger" data-delgame="${g.id}">${state.confirmGame === g.id ? "Wirklich löschen?" : "Spieltag löschen"}</button></div>
    </div>`).join("")}
  </section>`;
}

/* ---------- actions ---------- */
function waText() {
  const c = state.current;
  const line = id => { const p = P(id); return p ? `• ${p.name}${p.pos === "TW" ? " (TW)" : ""}` : ""; };
  return `⚽ Montagskick, ${fmtDate(c.date)}\n\n🟡 Team Gelb (${c.a.length})\n${sortTeam(c.a).map(line).join("\n")}\n\n🔵 Team Blau (${c.b.length})\n${sortTeam(c.b).map(line).join("\n")}`;
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast("Kopiert. Jetzt in WhatsApp einfügen."); }
  catch (e) { if (fallbackEl) { fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.select(); } toast("Text markiert. Bitte selbst kopieren."); }
}
const DEMO = [
  ["Jonas", 7, "TW"], ["Felix", 5, "TW"], ["Lukas", 8, "IV"], ["Tim", 6, "IV"], ["Niklas", 4, "LV"], ["Moritz", 7, "RV"],
  ["Paul", 6, "IV"], ["Ben", 5, "LAV"], ["Leon", 9, "ZOM"], ["Finn", 6, "ZM"], ["Elias", 5, "LM"], ["Noah", 7, "ZDM"],
  ["Luis", 4, "RM"], ["David", 8, "ZM"], ["Julian", 6, "ZDM"], ["Max", 5, "RM"], ["Simon", 3, "LM"], ["Erik", 9, "ST"],
  ["Tom", 6, "LF"], ["Jan", 7, "RF"], ["Kevin", 5, "MS"], ["Marco", 4, "ST"], ["Dennis", 6, "RAV"], ["Sven", 5, "LF"],
];

view.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-act],[data-swap],[data-edit],[data-dpos],[data-dpos2],[data-dattr],[data-delgame]");
  if (!t) return;
  const cur = state.current;
  if (t.dataset.swap) {
    const id = t.dataset.swap;
    if (!state.swapSel) state.swapSel = id;
    else if (state.swapSel === id) state.swapSel = null;
    else {
      const s = state.swapSel, inA = x => cur.a.includes(x);
      if (inA(s) !== inA(id)) {
        const [ida, idb] = inA(s) ? [s, id] : [id, s];
        cur.a = cur.a.map(x => x === ida ? idb : x); cur.b = cur.b.map(x => x === idb ? ida : x);
        store.saveCurrent(); state.swapSel = null;
      } else state.swapSel = id;
    }
    return render();
  }
  if (t.dataset.edit) { state.editing = t.dataset.edit; state.draft = null; state.confirmDel = false; render(); document.getElementById("editor")?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (t.dataset.dpos || t.dataset.dattr || t.dataset.dpos2 !== undefined) {
    const d = state.draft;
    d.name = document.getElementById("pname").value; d.active = document.getElementById("pactive").checked;
    if (t.dataset.dpos2 !== undefined) d.pos2 = t.dataset.dpos2;
    else if (t.dataset.dpos) { d.pos = t.dataset.dpos; if (d.pos2 === d.pos) d.pos2 = ""; }
    else d.attrs = { ...d.attrs, [t.dataset.dattr]: +t.dataset.v };
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.delgame) {
    const id = t.dataset.delgame;
    if (state.confirmGame !== id) { state.confirmGame = id; return render(); }
    state.confirmGame = null; await store.delGame(id); toast("Spieltag gelöscht"); return render();
  }
  switch (t.dataset.act) {
    case "goto-new": state.tab = "kader"; state.editing = "new"; state.draft = null; render(); document.getElementById("pname")?.focus(); break;
    case "goto-matchday": state.tab = "spieltag"; render(); break;
    case "cancel-edit": state.editing = null; state.draft = null; render(); break;
    case "save-player": {
      const name = document.getElementById("pname").value.trim();
      if (!name) { toast("Bitte einen Namen eingeben."); return; }
      const d = state.draft;
      const old = state.editing === "new" ? null : P(state.editing);
      const p = { id: old ? old.id : uid(), name, pos: d.pos, pos2: d.pos2 && d.pos2 !== d.pos ? d.pos2 : "", attrs: { ...d.attrs }, active: document.getElementById("pactive").checked };
      p.skill = ovr(p);
      const changed = !old || JSON.stringify(attrsOf(old)) !== JSON.stringify(p.attrs) || old.pos !== p.pos || (old.pos2 || "") !== p.pos2;
      p.ratedAt = changed ? today() : (old.ratedAt || today());
      const history = (old && old.history ? old.history.slice() : old ? [{ date: old.ratedAt || today(), ovr: ovr(old) }] : []);
      if (changed) { if (history.length && history[history.length - 1].date === p.ratedAt) history.pop(); history.push({ date: p.ratedAt, ovr: p.skill }); }
      p.history = history.slice(-20);
      if (d.demo) p.demo = true;
      await store.putPlayer(p);
      const wasNew = state.editing === "new";
      state.editing = wasNew ? "new" : null; state.draft = null;
      toast(wasNew ? `${name} angelegt. Nächster Spieler?` : "Gespeichert");
      render(); if (wasNew) document.getElementById("pname")?.focus();
      break;
    }
    case "del-player": {
      if (!state.confirmDel) { state.confirmDel = true; return render(); }
      const id = state.editing; state.confirmDel = false; state.editing = null; state.draft = null;
      cur.selected = cur.selected.filter(x => x !== id); store.saveCurrent();
      await store.delPlayer(id); toast("Spieler gelöscht"); render(); break;
    }
    case "demo": {
      for (const [name, skill, pos] of DEMO) {
        const attrs = {};
        for (const a of ATTRS) attrs[a.k] = a.k === "tor" ? (pos === "TW" ? skill : 1 + Math.floor(Math.random() * 4)) : Math.max(1, Math.min(10, skill + Math.round((Math.random() - 0.5) * 4)));
        const others = POS_ORDER.filter(k => k !== pos && LINE_OF[k] === LINE_OF[pos] && k !== "TW");
        const pos2 = name === "Tim" ? "TW" : (Math.random() < 0.5 && others.length ? others[Math.floor(Math.random() * others.length)] : "");
        const p = { id: uid(), name, pos, pos2, attrs, active: true, demo: true, ratedAt: today() };
        p.skill = ovr(p); p.history = [{ date: p.ratedAt, ovr: p.skill }];
        await store.putPlayer(p);
      }
      toast("Beispielkader geladen"); state.tab = "spieltag"; render(); break;
    }
    case "clear-demo": {
      for (const p of Object.values(state.players).filter(p => p.demo)) await store.delPlayer(p.id);
      cur.selected = cur.selected.filter(id => state.players[id]); cur.a = null; cur.b = null; store.saveCurrent();
      toast("Beispielspieler entfernt"); render(); break;
    }
    case "sel-last": { const lg = lastGame(); if (lg) cur.selected = [...new Set([...cur.selected, ...lg.a, ...lg.b])].filter(id => state.players[id]); store.saveCurrent(); render(); break; }
    case "sel-none": cur.selected = []; cur.a = null; cur.b = null; store.saveCurrent(); render(); break;
    case "build": {
      const ids = cur.selected.filter(id => state.players[id]);
      const res = buildTeams(ids); cur.a = res.a; cur.b = res.b; state.swapSel = null; store.saveCurrent(); render();
      document.querySelector(".teams")?.scrollIntoView({ behavior: "smooth", block: "start" });
      break;
    }
    case "copy": copyText(waText(), document.getElementById("wa")); break;
    case "save-game": {
      const existing = Object.values(state.games).find(g => g.date === cur.date);
      const g = { id: existing ? existing.id : uid(), date: cur.date, a: cur.a.slice(), b: cur.b.slice() };
      if (existing && typeof existing.scoreA === "number") { g.scoreA = existing.scoreA; g.scoreB = existing.scoreB; }
      await store.putGame(g);
      toast(existing ? "Spieltag aktualisiert" : "Spieltag gespeichert. Vorrecht für nächste Woche steht.");
      cur.date = nextMonday(new Date(new Date(cur.date + "T12:00:00").getTime() + 864e5).toISOString().slice(0, 10));
      cur.selected = []; cur.a = null; cur.b = null; store.saveCurrent();
      state.tab = "verlauf"; render(); break;
    }
    case "export": {
      const data = JSON.stringify({ app: "paulimania", v: 1, players: state.players, games: state.games });
      copyText(data, document.getElementById("backup")); break;
    }
    case "import": {
      const el = document.getElementById("backup");
      try {
        const d = JSON.parse(el.value);
        if (d.app !== "paulimania") throw new Error();
        for (const p of Object.values(d.players || {})) await store.putPlayer(normPlayer(p));
        for (const g of Object.values(d.games || {})) await store.putGame(g);
        el.value = ""; toast("Sicherung eingefügt"); render();
      } catch (err) { toast("Das ist keine gültige Paulimania-Sicherung."); }
      break;
    }
  }
});

view.addEventListener("change", async (e) => {
  const t = e.target;
  const cur = state.current;
  if (t.dataset.pick) {
    const id = t.dataset.pick;
    cur.selected = t.checked ? [...new Set([...cur.selected, id])] : cur.selected.filter(x => x !== id);
    store.saveCurrent(); render();
  } else if (t.id === "gdate") { cur.date = t.value || nextMonday(); store.saveCurrent(); }
  else if (t.dataset.score) {
    const g = { ...state.games[t.dataset.score] };
    const a = document.getElementById("sa-" + g.id).value, b = document.getElementById("sb-" + g.id).value;
    if (a !== "" && b !== "") { g.scoreA = +a; g.scoreB = +b; } else { delete g.scoreA; delete g.scoreB; }
    await store.putGame(g); if (a !== "" && b !== "") toast("Ergebnis gespeichert");
  }
});
view.addEventListener("input", (e) => {
  if (e.target.id === "filter") {
    state.filter = e.target.value; const pos = e.target.selectionStart;
    render(); const f = document.getElementById("filter"); f.focus(); f.setSelectionRange(pos, pos);
  }
});
view.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.dataset?.edit) e.target.click();
  if (e.key === "Enter" && e.target.id === "pname") view.querySelector('[data-act="save-player"]')?.click();
});
document.querySelector("nav.tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  state.tab = b.dataset.tab; state.editing = null; state.draft = null; render();
});

store.loadLocal();
render();
initDb();
})();
</script>
