<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!--APP-START-->
<title>Schneppenhausen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a matchday sheet; pitch-green header band, two team columns side by side on wide screens. */
:root {
  --bg: #eef2ec;
  --surface: #ffffff;
  --ink: #142019;
  --muted: #5a6a60;
  --line: #d3dcd3;
  --pitch: #1d6b3d;
  --pitch-ink: #f4f8f2;
  --accent: #1d6b3d;
  --accent-soft: #dcebdf;
  --team-a: #d48a12;
  --team-a-soft: #fbefd9;
  --team-b: #2f4ea8;
  --team-b-soft: #e1e7f7;
  --warn: #b5541c;
  --warn-soft: #f8e4d6;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1612; --surface: #18221c; --ink: #e6ede7; --muted: #95a69a; --line: #2b3a31;
    --pitch: #174f2f; --pitch-ink: #eef5ef; --accent: #5cc283; --accent-soft: #1f3a29;
    --team-a: #f0a93a; --team-a-soft: #3a2c14; --team-b: #7d97ea; --team-b-soft: #1e2744;
    --warn: #f08a52; --warn-soft: #3d2416; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1612; --surface: #18221c; --ink: #e6ede7; --muted: #95a69a; --line: #2b3a31;
  --pitch: #174f2f; --pitch-ink: #eef5ef; --accent: #5cc283; --accent-soft: #1f3a29;
  --team-a: #f0a93a; --team-a-soft: #3a2c14; --team-b: #7d97ea; --team-b-soft: #1e2744;
  --warn: #f08a52; --warn-soft: #3d2416; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { overscroll-behavior-y: contain; }
.ptr { position: fixed; left: 50%; top: env(safe-area-inset-top, 0px); z-index: 30; transform: translate(-50%, -60px);
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 8px 16px;
  font-size: 14px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.15); transition: transform .2s; pointer-events: none; white-space: nowrap; }
.ptr.dragging { transition: none; }
.ptr.ready { color: var(--accent); }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* Header band */
.band { background: var(--pitch); color: var(--pitch-ink); position: relative; overflow: hidden; }
.band::after {
  content: ""; position: absolute; right: -60px; top: 50%; width: 180px; height: 180px;
  border: 2px solid color-mix(in srgb, var(--pitch-ink) 25%, transparent); border-radius: 50%;
  transform: translateY(-50%); pointer-events: none;
}
.band::before {
  content: ""; position: absolute; right: 29px; top: 0; bottom: 0; width: 2px;
  background: color-mix(in srgb, var(--pitch-ink) 25%, transparent); pointer-events: none;
}
.band .wrap { padding-block: 18px 0; position: relative; z-index: 1; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 {
  font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: .5px;
  margin: 0; text-transform: uppercase; line-height: 1;
}
.brand span { font-size: 14px; opacity: .8; }
.whoami { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 14px; }
.whoami span { opacity: .8; }
.whoami select { background: color-mix(in srgb, var(--pitch-ink) 14%, transparent); color: var(--pitch-ink); border: 1px solid color-mix(in srgb, var(--pitch-ink) 35%, transparent); border-radius: 8px; padding: 5px 8px; font-weight: 600; }
.whoami select option { color: var(--ink); background: var(--surface); }
.panel.who { border-color: var(--accent); }
nav.tabs { display: flex; gap: 4px; margin-top: 14px; overflow-x: auto; }
nav.tabs button {
  border: 0; background: transparent; color: var(--pitch-ink); opacity: .75;
  font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .6px;
  text-transform: uppercase; padding: 8px 14px 10px; cursor: pointer; border-radius: 8px 8px 0 0;
}
nav.tabs button[aria-selected="true"] { background: var(--bg); color: var(--ink); opacity: 1; }
nav.tabs button:focus-visible { outline: 2px solid var(--pitch-ink); outline-offset: -2px; }

main .wrap { padding-block: 20px 60px; display: grid; gap: 20px; }
h2 {
  font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0;
  text-transform: uppercase; letter-spacing: .5px; text-wrap: balance;
}
h3 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0; letter-spacing: .4px; text-transform: uppercase; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; min-width: 0; }

/* Buttons */
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 9px;
  cursor: pointer; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--warn); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="text"], input[type="date"], input[type="number"], select, textarea {
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; min-width: 0;
}

/* Counter */
.counter { display: flex; align-items: baseline; gap: 6px; font-family: var(--font-display); }
.counter b { font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.counter span { font-size: 20px; color: var(--muted); }
.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.meter.over i { background: var(--warn); }

/* Chips */
.chip { font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.plain { background: var(--bg); color: var(--muted); }
.pos { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .5px; color: var(--muted); min-width: 56px; flex: none; }
.posgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .posgrid { grid-template-columns: 1fr; } }
.posname { text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 600; }
.pospick { display: grid; gap: 6px; }
.posline { display: grid; grid-template-columns: 72px 1fr; gap: 6px; align-items: center; }
.posline-l { font-size: 13px; color: var(--muted); }
.posline .seg button { min-width: 44px; padding: 7px 6px; font-family: var(--font-display); letter-spacing: .4px; font-size: 15px; }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.pos small { font-size: 11px; opacity: .7; font-weight: 600; }

/* Attendance list */
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.pick {
  display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; user-select: none; min-width: 0;
}
.pick input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.pick .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.pick.on { border-color: var(--accent); background: var(--accent-soft); }

/* Teams */
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .teams { grid-template-columns: 1fr; } }
.team { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; min-width: 0; }
.team header { padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-top: 5px solid var(--tc); background: var(--tcs); }
.team.a { --tc: var(--team-a); --tcs: var(--team-a-soft); }
.team.b { --tc: var(--team-b); --tcs: var(--team-b-soft); }
.team header h3 { color: var(--ink); }
.team .stat { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.team ol { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
.team li button {
  width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid transparent;
  background: transparent; padding: 7px 8px; border-radius: 8px; cursor: pointer;
}
.team li button:hover { background: var(--bg); }
.team li button.sel { border-color: var(--tc); background: var(--tcs); }
.team li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skill { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); font-size: 14px; }
.posbar { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 14px 12px; font-size: 13px; color: var(--muted); }
.balance { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
.balance b { font-variant-numeric: tabular-nums; }
.hint { font-size: 14px; color: var(--muted); }

/* Tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--bg); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.dots i.on { background: var(--accent); }

/* Editor */
.editor { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .editor { grid-template-columns: 1fr; } }
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--bg); padding: 7px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.scale button { padding: 7px 0; font-variant-numeric: tabular-nums; }

/* Rating editor */
.attrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
@media (max-width: 400px) { .attrs { grid-template-columns: 1fr; } }
.attr { display: grid; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); min-width: 0; }
.attr.dim { opacity: .7; }
.attr-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.attr-val { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.attr .seg button { background: var(--surface); padding: 6px 0; }
.attr .seg button[aria-pressed="true"] { background: var(--accent); }
.check { display: flex; gap: 8px; align-items: flex-start; }
.check input { flex: none; margin-top: 3px; }
.intro { margin: 0; color: var(--muted); font-size: 15px; max-width: 62ch; }
.plrows { display: grid; gap: 6px; }
.plrow { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.plrow.off { opacity: .6; }
.plmain { display: grid; gap: 2px; min-width: 0; }
.plname { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.placts { display: grid; gap: 4px; }
.placts .btn { justify-content: center; }
.delbox { grid-column: 1 / -1; display: grid; gap: 8px; padding: 10px 12px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); }
.delbox .hint { color: var(--ink); }
.holdbtn { position: relative; overflow: hidden; color: var(--warn); border-color: var(--warn); background: var(--surface);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; min-width: 170px; justify-content: center; }
.holdbtn i { position: absolute; inset: 0 auto 0 0; width: 0; background: color-mix(in srgb, var(--warn) 35%, transparent); pointer-events: none; }
.holdbtn span { position: relative; pointer-events: none; font-variant-numeric: tabular-nums; }
.plmeta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.plscore { display: flex; align-items: baseline; gap: 4px; }
.plscore b { font-family: var(--font-display); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.posnow { display: grid; gap: 2px; padding: 10px 12px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line); }
.selfavg { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.savg { display: grid; gap: 6px; }
.savg-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 34px; gap: 10px; align-items: center; font-size: 14px; }
.savg-row b { text-align: right; font-variant-numeric: tabular-nums; }
.savg-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.savg-bar i { display: block; height: 100%; background: var(--accent); }
.rings { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.ring { display: grid; justify-items: center; gap: 3px; min-width: 0; }
.ring svg { width: 62px; height: 62px; max-width: 100%; }
.ring-n { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ring-s { font-size: 12px; font-weight: 600; color: var(--warn); }
.ring-s.ok { color: var(--accent); }
.gknote { margin: 0; font-size: 14px; padding: 10px 12px; border-radius: 9px; background: var(--team-b-soft); color: var(--ink); }
.mynote { font-size: 14px; padding: 10px 12px; border-radius: 9px; background: var(--accent-soft); color: var(--ink); }
.mynote.warn { background: var(--warn-soft); }
.small-btn { padding: 5px 10px; font-size: 13px; }
.trend { font-size: 11px; }
.trend.up { color: var(--accent); }
.trend.down { color: var(--warn); }
/* Team comparison */
.cmp summary { font-size: 15px; }
.cmp-grid { display: grid; gap: 6px; margin-top: 10px; max-width: 560px; }
.cmp-row { display: grid; grid-template-columns: 30px 1fr 72px 1fr 30px; align-items: center; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.cmp-l { text-align: center; color: var(--muted); font-weight: 600; }
.cmp-v:last-child { text-align: right; }
.cmp-bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: flex; }
.cmp-bar.a { justify-content: flex-end; }
.cmp-bar.a i { background: var(--team-a); }
.cmp-bar.b i { background: var(--team-b); }
.cmp-bar i { display: block; height: 100%; }

/* History */
.game { display: grid; gap: 8px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.game:last-child { border-bottom: 0; }
.score { display: flex; align-items: center; gap: 6px; }
.score input { width: 56px; text-align: center; }
.empty { padding: 26px 16px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 15px;
  box-shadow: 0 6px 24px rgba(0,0,0,.2); z-index: 20; max-width: calc(100% - 32px);
}
textarea { width: 100%; min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
details summary { cursor: pointer; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="band">
  <div class="wrap">
    <div class="brand"><h1>Schneppenhausen</h1><span>Montagskick · 11 gegen 11</span>
      <label class="whoami"><span>Ich bin</span><select id="whoami" aria-label="Wer benutzt dieses Gerät?"><option value="">auswählen</option></select></label></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="spieler" aria-selected="false">Spieler</button>
      <button role="tab" data-tab="spieltag" aria-selected="true">Spieltag</button>
      <button role="tab" data-tab="statistik" aria-selected="false">Statistik</button>
    </nav>
  </div>
</div>

<main>
  <div class="wrap" id="view"></div>
</main>
<div class="toast" id="toast" hidden></div>
<div class="ptr" id="ptr" aria-live="polite">↓ Zum Aktualisieren ziehen</div>

<script>
(() => {
"use strict";

// Detailed positions, grouped into lines (Tor, Abwehr, Mittelfeld, Sturm) for balancing.
const POSITIONS = [
  { k: "TW", name: "Torwart", line: "TW" },
  { k: "LV", name: "Linker Verteidiger", line: "ABW" },
  { k: "IV", name: "Innenverteidiger", line: "ABW" },
  { k: "RV", name: "Rechter Verteidiger", line: "ABW" },
  { k: "ZM", name: "Zentrales Mittelfeld", line: "MIT" },
  { k: "ZOM", name: "Offensives Mittelfeld", line: "MIT" },
  { k: "LF", name: "Linker Flügelstürmer", line: "STU" },
  { k: "ST", name: "Stürmer", line: "STU" },
  { k: "RF", name: "Rechter Flügelstürmer", line: "STU" },
];
const LINES = { TW: "Tor", ABW: "Abwehr", MIT: "Mittelfeld", STU: "Sturm" };
const LINE_ORDER = ["TW", "ABW", "MIT", "STU"];
const POS_ORDER = POSITIONS.map(x => x.k);
const POS = Object.fromEntries(POSITIONS.map(x => [x.k, x.name]));
const LINE_OF = Object.fromEntries(POSITIONS.map(x => [x.k, x.line]));
// Players saved before detailed positions existed
// (and positions that were removed later: ZDM, LAV, RAV, LM, RM, MS map to the closest remaining one)
const LEGACY_POS = { ABW: "IV", MIT: "ZM", STU: "ST", ZDM: "ZM", LAV: "LV", RAV: "RV", LM: "LF", RM: "RF", MS: "ST" };
function mapPos(x) { return LEGACY_POS[x] || x; }
function normPlayer(p) {
  if (!p) return p;
  const q = { ...p };
  if (LEGACY_POS[q.pos]) q.pos = LEGACY_POS[q.pos];
  if (q.pos && !POS[q.pos]) q.pos = "ZM";
  q.pos = q.pos || "";
  // secondary positions: list (older saves had a single string)
  const alt = Array.isArray(q.pos2) ? q.pos2 : q.pos2 ? [q.pos2] : [];
  q.pos2 = [...new Set(alt.map(x => LEGACY_POS[x] || x))].filter(x => POS[x] && x !== q.pos).sort((x, y) => POS_ORDER.indexOf(x) - POS_ORDER.indexOf(y));
  return q;
}
function normAll(players) { return Object.fromEntries(Object.entries(players || {}).map(([k, v]) => [k, normPlayer(v)])); }
// Rating criteria. w = weight in a field player's overall rating.
const ATTRS = [
  { k: "kon", name: "Kondition", short: "Kondi", hint: "Hält er das ganze Spiel durch, läuft er viel?", w: 1.1 },
  { k: "tem", name: "Tempo", short: "Tempo", hint: "Antritt und Endgeschwindigkeit", w: 1.0 },
  { k: "bal", name: "Ballbehandlung", short: "Ball", hint: "Annahme, Dribbling, behauptet er den Ball?", w: 1.2 },
  { k: "pas", name: "Passspiel", short: "Pass", hint: "Kommen kurze und lange Pässe an?", w: 1.0 },
  { k: "spv", name: "Spielverständnis", short: "Spielv.", hint: "Stellungsspiel, Übersicht, gute Entscheidungen", w: 1.3 },
  { k: "zwb", name: "Zweikampfbereitschaft", short: "ZK-Wille", hint: "Geht er dazwischen, sucht er die Duelle, gibt er nicht auf?", w: 0.6 },
  { k: "zwh", name: "Härte", short: "Härte", hint: "Körpereinsatz, Robustheit", w: 0.6 },

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

// Pull down at the top of the page to load the latest data again.
async function refreshNow() {
  if (db) {
    try {
      const [ps, gs, rs, cur, orga] = await Promise.all([
        db.collection("players").get(), db.collection("games").get(), db.collection("ratings").get(),
        db.doc("meta/current").get(), db.doc("meta/orga").get()]);
      state.players = Object.fromEntries(ps.docs.map(x => [x.id, normPlayer({ ...x.data(), id: x.id })]));
      state.games = Object.fromEntries(gs.docs.map(x => [x.id, { ...x.data(), id: x.id }]));
      state.ratings = Object.fromEntries(rs.docs.map(x => [x.id, normRatingDoc(x.id, x.data())]));
      state.revoked = (orga.exists && (orga.data() || {}).revoked) || [];
      if (cur.exists && curSeq === curSaved) state.current = Object.assign({ date: nextMonday(), selected: [], a: null, b: null }, JSON.parse(JSON.stringify(cur.data())));
      refreshMe(); computeAvg();
    } catch (e) { toast("Aktualisieren hat nicht geklappt. Verbindung prüfen."); return false; }
  } else { store.loadLocal(); }

(function pullToRefresh() {
  const el = document.getElementById("ptr"), GO = 70, MAX = 110;
  let pull = null, busy = false;
  const show = (h, text, cls) => {
    el.style.transform = `translate(-50%, ${Math.round(h - 60)}px)`;
    el.textContent = text; el.className = "ptr" + (cls ? " " + cls : "");
  };
  const reset = () => show(0, "↓ Zum Aktualisieren ziehen", "");
  window.addEventListener("touchstart", (e) => {
    if (busy || state.holding || window.scrollY > 0 || e.touches.length !== 1) return;
    if (e.target.closest && e.target.closest("[data-hold], input, textarea, select, .tablewrap")) return;
    pull = { y0: e.touches[0].clientY, h: 0 };
  }, { passive: true });
  window.addEventListener("touchmove", (e) => {
    if (!pull) return;
    if (window.scrollY > 0) { pull = null; return reset(); }
    const dy = e.touches[0].clientY - pull.y0;
    pull.h = Math.max(0, Math.min(MAX, dy * 0.5));
    if (pull.h <= 0) return reset();
    const ready = pull.h >= GO;
    show(pull.h, ready ? "↑ Loslassen zum Aktualisieren" : "↓ Zum Aktualisieren ziehen", "dragging" + (ready ? " ready" : ""));
  }, { passive: true });
  const end = async () => {
    if (!pull) return;
    const go = pull.h >= GO; pull = null;
    if (!go) return reset();
    busy = true; show(GO, "Aktualisiere …", "ready");
    await refreshNow();
    busy = false; reset();
  };
  window.addEventListener("touchend", end);
  window.addEventListener("touchcancel", () => { pull = null; reset(); });
})();

async function initDb() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  let d = null;
  try { d = await window.claude.use("db"); } catch (e) { d = null; }
  if (!d) return;
  db = d; state.mode = "db";
  state.ratings = {}; state.me = null; state.myKey = null; state.revoked = []; computeAvg();
  let u = null;
  try { u = await window.claude.use("user"); } catch (e) { u = null; }
  if (u) {
    try { state.userId = await u.id(); } catch (e) { state.userId = null; }
    try { state.isOwner = await u.isOwner(); } catch (e) { state.isOwner = false; }
  } else { state.isOwner = false; }
  state.myKey = state.userId;
  const seen = { players: false, games: false, current: false, ratings: false, orga: false };
  let migrated = false;
  const timer = setTimeout(() => { if (!state.loaded) { state.loaded = true; render(); } }, 10000);
  const done = (k) => {
    seen[k] = true;
    if (seen.players && seen.games && seen.current && seen.ratings && seen.orga) {
      state.loaded = true; clearTimeout(timer);
      if (!migrated) { migrated = true; migrateLegacy(); pruneMine(); migratePosVotes(); }
    }
    render();
  };
  db.collection("ratings").onSnapshot(s => {
    state.ratings = Object.fromEntries(s.docs.map(x => [x.id, normRatingDoc(x.id, x.data())]));
    refreshMe(); computeAvg(); done("ratings");
  }, () => done("ratings"));
  db.doc("meta/orga").onSnapshot(s => {
    state.revoked = (s.exists && (s.data() || {}).revoked) || [];
    refreshMe(); computeAvg(); done("orga");
  }, () => done("orga"));
  db.collection("players").onSnapshot(s => {
    state.players = Object.fromEntries(s.docs.map(x => [x.id, normPlayer({ ...x.data(), id: x.id })])); computeAvg(); done("players");
  }, () => done("players"));
  db.collection("games").onSnapshot(s => {
    state.games = Object.fromEntries(s.docs.map(x => [x.id, { ...x.data(), id: x.id }])); done("games");
  }, () => done("games"));
  db.doc("meta/current").onSnapshot(s => {
    // ignore copies while this device still has unsaved or in-flight changes
    if (s.exists && !s.metadata.hasPendingWrites && curSeq === curSaved) {
      const next = Object.assign({ date: nextMonday(), selected: [], a: null, b: null }, JSON.parse(JSON.stringify(s.data())));
      if (JSON.stringify(next) === JSON.stringify(state.current) && state.loaded) return;
      state.current = next;
    }
    done("current");
  }, () => done("current"));
}

/* ---------- team balancing ---------- */
// Cost of a split: strength gap, position imbalance (goalkeepers count most),
// and a small penalty for pairs who were teammates last week (more variety).
function makeScorer(ids) {
  const lg = lastGame();
  const lastTeam = {};
  if (lg) { lg.a.forEach(id => lastTeam[id] = "a"); lg.b.forEach(id => lastTeam[id] = "b"); }
  const cache = {};
  for (const id of ids) { const p = P(id); cache[id] = { o: ovr(p), at: attrsOf(p || {}), gk: isGK(p), cov: coverage(p), lcov: lineCoverage(p) }; }
  return (a, b) => {
    const sum = t => t.reduce((s, id) => s + cache[id].o, 0);
    let cost = Math.abs(sum(a) - sum(b)) * 3;
    // also balance each criterion, so one team isn't all runners and the other all technicians
    for (const at of BAL_ATTRS) {
      const use = id => at.k === "cha" || !cache[id].gk;
      const sa = a.reduce((s, id) => s + (use(id) ? cache[id].at[at.k] : 0), 0), sb = b.reduce((s, id) => s + (use(id) ? cache[id].at[at.k] : 0), 0);
      cost += Math.abs(sa - sb) * 0.25;
    }
    // position coverage: main position counts 1, secondary position 0.5
    const cov = (t, pos) => t.reduce((s, id) => s + (cache[id].cov[pos] || 0), 0);
    for (const pos of POS_ORDER) cost += Math.abs(cov(a, pos) - cov(b, pos)) * (pos === "TW" ? 12 : 0.6);
    // and per line (Abwehr, Mittelfeld, Sturm)
    const covL = (t, line) => t.reduce((s, id) => s + (cache[id].lcov[line] || 0), 0);
    for (const line of LINE_ORDER) if (line !== "TW") cost += Math.abs(covL(a, line) - covL(b, line)) * 2;
    const together = t => { let n = 0; for (let i = 0; i < t.length; i++) for (let j = i + 1; j < t.length; j++) { const x = lastTeam[t[i]], y = lastTeam[t[j]]; if (x && x === y) n++; } return n; };
    cost += (together(a) + together(b)) * 0.15;
    return cost;
  };
}
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildTeams(ids) {
  const score = makeScorer(ids);
  const half = Math.ceil(ids.length / 2);
  const found = new Map();
  for (let r = 0; r < 150; r++) {
    const s = shuffle(ids);
    let a = s.slice(0, half), b = s.slice(half);
    let best = score(a, b), improved = true;
    while (improved) {
      improved = false;
      for (let i = 0; i < a.length && !improved; i++) for (let j = 0; j < b.length; j++) {
        const na = a.slice(), nb = b.slice(); [na[i], nb[j]] = [nb[j], na[i]];
        const c = score(na, nb);
        if (c < best - 1e-9) { a = na; b = nb; best = c; improved = true; break; }
      }
    }
    const key = a.slice().sort().join(",");
    if (!found.has(key)) found.set(key, { a, b, cost: best });
  }
  const all = [...found.values()].sort((x, y) => x.cost - y.cost);
  const top = all.filter(x => x.cost <= all[0].cost + 1.5).slice(0, 8);
  const pick = top[Math.floor(Math.random() * top.length)];
  return { a: pick.a, b: pick.b };
}
function teamStats(t) {
  const all = t.map(P).filter(Boolean);
  const ps = all.filter(revealed);
  const sum = ps.reduce((s, p) => s + ovr(p), 0);
  const byPos = Object.fromEntries(LINE_ORDER.map(k => [k, ps.filter(p => LINE_OF[p.pos] === k).length]));
  const attrAvg = Object.fromEntries(BAL_ATTRS.map(a => { const q = a.k === "cha" ? ps : ps.filter(p => !isGK(p)); return [a.k, q.length ? q.reduce((s, p) => s + attrsOf(p)[a.k], 0) / q.length : 0]; }));
  const byLine = Object.fromEntries(LINE_ORDER.map(k => [k, all.filter(p => LINE_OF[p.pos] === k).length]));
  return { n: all.length, shown: ps.length, sum, avg: ps.length ? sum / ps.length : 0, byPos: byLine, attrAvg };
}
function sortTeam(t) {
  return t.slice().sort((x, y) => POS_ORDER.indexOf(P(x)?.pos) - POS_ORDER.indexOf(P(y)?.pos) || (P(x)?.name || "").localeCompare(P(y)?.name || "", "de"));
}

/* ---------- attendance stats ---------- */
function playerStats() {
  const games = sortedGames();
  const recent = games.slice(0, 8);
  const res = {};
  for (const p of Object.values(state.players)) res[p.id] = { total: 0, recent: recent.map(() => false), last: null, w: 0, d: 0, l: 0 };
  games.forEach((g) => {
    const has = typeof g.scoreA === "number" && typeof g.scoreB === "number";
    for (const [side, ids] of [["a", g.a], ["b", g.b]]) for (const id of ids) {
      const r = res[id]; if (!r) continue;
      r.total++; if (!r.last) r.last = g.date;
      if (has) { const my = side === "a" ? g.scoreA : g.scoreB, op = side === "a" ? g.scoreB : g.scoreA; if (my > op) r.w++; else if (my < op) r.l++; else r.d++; }
    }
  });
  recent.forEach((g, i) => { for (const id of [...g.a, ...g.b]) if (res[id]) res[id].recent[i] = true; });
  return res;
}
function trend(p) {
  const h = p.history || [];
  if (h.length < 2) return 0;
  const d = h[h.length - 1].ovr - h[h.length - 2].ovr;
  return Math.abs(d) < 0.05 ? 0 : d;
}
function statusOf(p, st, lg) {
  if (lg && (lg.a.includes(p.id) || lg.b.includes(p.id))) return { label: "Vorrecht", cls: "" };
  if (!st.total) return { label: "Neu", cls: "plain" };
  const weeks = st.last ? Math.floor((Date.now() - new Date(st.last + "T12:00:00")) / 6048e5) : 99;
  if (weeks >= 4) return { label: `${weeks} Wo. weg`, cls: "warn" };
  return { label: "Ersatz", cls: "plain" };
}

function renderTeams() {
  const cur = state.current;

      <span class="cmp-v">${f1(vb)}</span></div>`; }).join("");
  const missing = [...cur.selected].filter(id => state.players[id] && !cur.a.includes(id) && !cur.b.includes(id));
  const unr = [...cur.a, ...cur.b].filter(id => P(id) && !isRated(P(id))).length;
  const partial = [...cur.a, ...cur.b].filter(id => P(id) && isRated(P(id)) && !revealed(P(id))).length;
  const nopos = [...cur.a, ...cur.b].filter(id => P(id) && !P(id).pos).length;
  const stale = cur.a.length + cur.b.length !== cur.selected.filter(id => state.players[id]).length || missing.length;
  const team = (key, title, t, st) => `
    <div class="team ${key}">
      <header><h3>${title}</h3><span class="stat">${st.n} Spieler · Ø ${st.shown ? f1(st.avg) + (st.shown < st.n ? ` (aus ${st.shown})` : "") : "?"}</span></header>
      <ol>${sortTeam(t).map(id => { const p = P(id); if (!p) return ""; return `<li><button data-swap="${id}" class="${state.swapSel === id ? "sel" : ""}">
        ${posHtml(p)}<span class="nm">${esc(p.name)}</span><span class="skill">${ovrText(p)}</span></button></li>`; }).join("")}</ol>
      <div class="posbar">${LINE_ORDER.map(k => `<span>${LINES[k]} ${st.byPos[k]}</span>`).join("")}</div>
    </div>`;
  return `
  <section class="panel">
    <div class="row spread">
      <h2>Teams</h2>
      <div class="balance"><span>Stärke <b>${f1(A.sum)}</b> : <b>${f1(B.sum)}</b></span>
        <span class="chip ${diff > 3 ? "warn" : ""}">${diff < 0.05 ? "Exakt ausgeglichen" : `Differenz ${f1(diff)}`}</span></div>
    </div>
    ${stale ? `<p class="chip warn" style="justify-self:start">Auswahl hat sich geändert. „Neu mischen“ drücken.</p>` : ""}
    ${unr || nopos || partial ? `<p class="hint" style="margin:0"><span class="chip warn">Hinweis</span> ${[unr ? `${unr} Spieler ${unr === 1 ? "ist" : "sind"} noch nicht bewertet und ${unr === 1 ? "zählt" : "zählen"} als Durchschnitt (5)` : "", partial ? `${partial} noch nicht von allen bewertet (Zahl als „?“, für die Verteilung zählen die vorhandenen Bewertungen)` : "", nopos ? `${nopos} ohne Position` : ""].filter(Boolean).join(", ")}. Stärke und Vergleich zeigen nur fertig bewertete Spieler.</p>` : ""}
    <div class="teams">${team("a", "Team Gelb", cur.a, A)}${team("b", "Team Blau", cur.b, B)}</div>
    <details class="cmp"><summary>Vergleich nach Kriterien (Durchschnitt pro Team)</summary>
      <div class="cmp-grid">${cmp}</div></details>
    <p class="hint">Tausch von Hand: einen Spieler antippen, dann einen aus dem anderen Team. Die Stärkewerte sind nur für dich und kommen nicht in den WhatsApp-Text.</p>
    <div class="row">
      <button class="btn primary" data-act="copy">Für WhatsApp kopieren</button>
      <button class="btn" data-act="save-game">Spieltag speichern</button>
    </div>
    <textarea id="wa" readonly hidden></textarea>
  </section>`;
}

// Overview: how many players each organizer has rated (himself excluded).
function progressPanel(players) {
  const done = players.filter(revealed).length;
  const R = 25, C = 2 * Math.PI * R;
  const rings = ORGA.map(n => {
    const todo = players.filter(p => orgaOf(p) !== n);
    const rated = todo.filter(p => ratersOf(p).includes(n)).length;
    const left = todo.length - rated, ok = left === 0 && todo.length > 0;
    const off = todo.length ? C * (1 - rated / todo.length) : C;
    return `<div class="ring" title="${n}: ${rated} von ${todo.length} bewertet">
      <svg viewBox="0 0 62 62" aria-hidden="true">
        <circle cx="31" cy="31" r="${R}" fill="none" style="stroke:var(--line)" stroke-width="7"/>
        <circle cx="31" cy="31" r="${R}" fill="none" style="stroke:var(${ok ? "--accent" : "--warn"})" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 31 31)"/>
        <text x="31" y="36.5" text-anchor="middle" style="fill:var(--ink);font-family:var(--font-display);font-weight:700;font-size:17px">${rated}</text>
      </svg>
      <span class="ring-n">${n}${n === state.me ? " (du)" : ""}</span>
      <span class="ring-s ${ok ? "ok" : ""}">${ok ? "fertig" : `noch ${left}`}</span>
    </div>`;
  }).join("");
  return `<section class="panel">
    <div class="row spread"><h2>Bewertet</h2><span class="hint">${done}/${players.length} Spieler fertig</span></div>
    <div class="rings" role="list" aria-label="Bewertungsstand pro Orga-Mitglied">${rings}</div>
  </section>`;
}

function quickAdd(first) {
  return `<section class="panel">
    <h2>${first ? "Spieler anlegen" : "Spieler hinzufügen"}</h2>
    ${intro("Erst mal nur die Namen eintragen. Mehrere auf einmal gehen mit Komma getrennt. Positionen und Bewertung trägt danach jeder aus dem Orga-Team über „Bearbeiten“ ein.")}
    <div class="row"><input type="text" id="qadd" placeholder="z. B. Max K., Tom, Jan S." autocomplete="off" style="flex:1;min-width:180px">
      <button class="btn primary" data-act="quick-add">Hinzufügen</button></div>
    ${first ? `<div><button class="btn ghost" data-act="demo">Oder: Beispielspieler zum Testen laden</button></div>` : ""}
  </section>`;
}

  const hasDemo = players.some(p => p.demo);

    <div class="row small">
      ${state.me ? `<span class="chip ${mineMissing.length ? "warn" : ""}">${mineMissing.length ? `${state.me}, du hast ${rateable.length - mineMissing.length} von ${rateable.length} bewertet` : `${state.me}, du hast alle bewertet`}</span>` : ""}
      ${nobody ? `<span class="chip warn">${nobody} noch von niemandem bewertet</span>` : ""}

        </div>

    <div class="posgrid">

    </div>
  </section>`;
}

/* ---------- own averages (only for the organizer himself, once all others rated) ---------- */
function selfAverages(p) {
  if (!revealed(p) || !state.avg[p.id]) {
    const miss = missingRaters(p);
    return `<div class="selfavg"><b>Deine Durchschnittswerte</b><p class="hint" style="margin:0">Erscheinen, sobald ${requiredRaters(p).join(", ")} dich bewertet haben.${miss.length ? ` Es fehlt noch: ${miss.join(", ")}.` : ""}</p></div>`;
  }
  const at = attrsOf(p);
  return `<div class="selfavg"><b>So habt ihr mich bewertet: Durchschnitt aus ${state.avg[p.id].n} Bewertungen</b>
    <p class="hint" style="margin:0">Nur der Durchschnitt pro Kriterium. Wer welchen Wert gegeben hat, siehst du nicht.</p>
    <div class="savg">${attrSet(p.pos).map(a => `<div class="savg-row"><span>${a.name}${a.bal ? ` <span class="muted small">(zählt nicht zur Stärke)</span>` : ""}</span>
      <div class="savg-bar"><i style="width:${at[a.k] * 10}%"></i></div><b>${f1(at[a.k])}</b></div>`).join("")}</div>
    <p class="small" style="margin:0">Gesamtstärke: <b>${f1(ovr(p))}</b></p></div>`;
}

/* ---------- hold to delete ---------- */
const HOLD_MS = 5000;
function holdBtn(id) { return `<button class="btn small-btn holdbtn" data-hold="${id}" type="button"><i></i><span>5 s gedrückt halten</span></button>`; }
let hold = null;
function startHold(btn) {
  if (hold) return;
  const id = btn.dataset.hold, bar = btn.querySelector("i"), label = btn.querySelector("span");
  btn.classList.add("holding");
  bar.style.transition = "none"; bar.style.width = "0%"; void bar.offsetWidth;
  bar.style.transition = `width ${HOLD_MS}ms linear`; bar.style.width = "100%";
  const t0 = Date.now();
  label.textContent = "Halten … 5";
  const tick = setInterval(() => { const left = Math.ceil((HOLD_MS - (Date.now() - t0)) / 1000); label.textContent = left > 0 ? `Halten … ${left}` : "Wird gelöscht"; }, 100);
  state.holding = true;
  hold = { btn, tick, timer: setTimeout(async () => {
    clearInterval(tick); hold = null; state.holding = false; state.pendingRender = false;
    state.confirmRow = null; state.confirmDel = false;
    await deletePlayer(id);
  }, HOLD_MS) };
}
function cancelHold() {
  if (!hold) return;
  clearTimeout(hold.timer); clearInterval(hold.tick);
  const { btn } = hold; hold = null; state.holding = false;
  btn.classList.remove("holding");
  const bar = btn.querySelector("i"); bar.style.transition = "width .2s"; bar.style.width = "0%";
  btn.querySelector("span").textContent = "5 s gedrückt halten";
  toast("Losgelassen. Nichts gelöscht.");
  if (state.pendingRender) { state.pendingRender = false; render(); }
}
view.addEventListener("pointerdown", (e) => {
  const b = e.target.closest("[data-hold]"); if (!b) return;
  e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (err) {}
  startHold(b);
});
window.addEventListener("pointerup", cancelHold);
window.addEventListener("pointercancel", cancelHold);
window.addEventListener("blur", cancelHold);
view.addEventListener("contextmenu", (e) => { if (e.target.closest("[data-hold]")) e.preventDefault(); });
view.addEventListener("keydown", (e) => { const b = e.target.closest?.("[data-hold]"); if (b && (e.key === " " || e.key === "Enter")) { e.preventDefault(); if (!e.repeat) startHold(b); } });
view.addEventListener("keyup", (e) => { if (e.target.closest?.("[data-hold]") && (e.key === " " || e.key === "Enter")) cancelHold(); });

/* ---------- actions ---------- */
async function deletePlayer(id) {
  const cur = state.current, name = P(id)?.name || "Spieler";
  if (state.editing === id) { state.editing = null; state.draft = null; }
  cur.selected = cur.selected.filter(x => x !== id);
  if (cur.a) { cur.a = cur.a.filter(x => x !== id); cur.b = cur.b.filter(x => x !== id); }
  store.saveCurrent();
  // Ratings of this player: my own go now; in shared mode every other organizer's
  // copy is removed the next time they open the app (each may only change their own).
  if (db) await store.delMyRatings([id]);
  else {
    for (const rid of Object.keys(state.ratings)) {
      const r = state.ratings[rid]; if (!r.players[id]) continue;
      const players = { ...r.players }; delete players[id];
      state.ratings = { ...state.ratings, [rid]: { ...r, players } };
    }
  }
  computeAvg();
  await store.delPlayer(id);
  toast(`${name} gelöscht`); render();
}
function waText() {
  const c = state.current;
  const line = id => { const p = P(id); return p ? `• ${p.name}${p.pos === "TW" ? " (TW)" : ""}` : ""; };
  return `⚽ Montagskick, ${fmtDate(c.date)}\n\n🟡 Team Gelb (${c.a.length})\n${sortTeam(c.a).map(line).join("\n")}\n\n🔵 Team Blau (${c.b.length})\n${sortTeam(c.b).map(line).join("\n")}`;
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast("Kopiert. Jetzt in WhatsApp einfügen."); }
  catch (e) { if (fallbackEl) { fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.select(); } toast("Text markiert. Bitte selbst kopieren."); }
}
const DEMO = [
  ["Jonas", 7, "TW"], ["Felix", 5, "TW"], ["Lukas", 8, "IV"], ["Tim", 6, "IV"], ["Niklas", 4, "LV"], ["Moritz", 7, "RV"],
  ["Paul", 6, "IV"], ["Ben", 5, "LV"], ["Leon", 9, "ZOM"], ["Finn", 6, "ZM"], ["Elias", 5, "LF"], ["Noah", 7, "ZM"],
  ["Luis", 4, "RF"], ["David", 8, "ZM"], ["Julian", 6, "ZM"], ["Max", 5, "RV"], ["Simon", 3, "LF"], ["Erik", 9, "ST"],
  ["Tom", 6, "LF"], ["Jan", 7, "RF"], ["Kevin", 5, "ST"], ["Marco", 4, "ST"], ["Dennis", 6, "RV"], ["Sven", 5, "ZOM"],
];

view.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-dorga],[data-release],[data-delrow],[data-plf],[data-me],[data-act],[data-swap],[data-edit],[data-dpos],[data-dpos2],[data-dattr],[data-delgame]");
  if (!t) return;
  const cur = state.current;
  if (t.dataset.me) { await setMe(t.dataset.me); return; }
  if (t.dataset.release) {
    if (state.confirmRelease !== t.dataset.release) { state.confirmRelease = t.dataset.release; return render(); }
    state.confirmRelease = null; await releaseClaim(t.dataset.release); return;
  }
  if (t.dataset.delrow) { state.confirmRow = t.dataset.delrow; return render(); }
  if (t.dataset.plf) { state.plFilter = t.dataset.plf; return render(); }
  if (t.dataset.swap) {
    const id = t.dataset.swap;
    if (!state.swapSel) state.swapSel = id;
    else if (state.swapSel === id) state.swapSel = null;
    else {
      const s = state.swapSel, inA = x => cur.a.includes(x);
      if (inA(s) !== inA(id)) {
        const [ida, idb] = inA(s) ? [s, id] : [id, s];
        cur.a = cur.a.map(x => x === ida ? idb : x); cur.b = cur.b.map(x => x === idb ? ida : x);
        store.saveCurrent(); state.swapSel = null;
      } else state.swapSel = id;
    }
    return render();
  }
  if (t.dataset.edit) { state.editing = t.dataset.edit; state.draft = null; state.confirmDel = false; render(); document.getElementById("editor")?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (t.dataset.dorga !== undefined) { state.draft.orga = t.dataset.dorga; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.dataset.dpos || t.dataset.dattr || t.dataset.dpos2 !== undefined) {
    const d = state.draft;
    d.name = document.getElementById("pname").value; d.active = document.getElementById("pactive").checked;
    if (t.dataset.dpos2 !== undefined) {
      const k = t.dataset.dpos2;
      d.pos2 = !k ? [] : d.pos2.includes(k) ? d.pos2.filter(x => x !== k) : [...d.pos2, k].sort((x, y) => POS_ORDER.indexOf(x) - POS_ORDER.indexOf(y));
    }
    else if (t.dataset.dpos) { d.pos = t.dataset.dpos; d.pos2 = d.pos2.filter(x => x !== d.pos); }
    else { d.attrs = { ...d.attrs, [t.dataset.dattr]: +t.dataset.v }; d.touched = true; }
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.delgame) {
    const id = t.dataset.delgame;
    if (state.confirmGame !== id) { state.confirmGame = id; return render(); }
    state.confirmGame = null; await store.delGame(id); toast("Spieltag gelöscht"); return render();
  }
  switch (t.dataset.act) {
    case "goto-new": state.tab = "spieler"; state.editing = null; state.draft = null; render(); document.getElementById("qadd")?.focus(); break;
    case "quick-add": {
      const el = document.getElementById("qadd");
      const names = el.value.split(/[,;\n]/).map(x => x.trim()).filter(Boolean);
      if (!names.length) { toast("Bitte einen Namen eingeben."); el.focus(); return; }
      const have = new Set(Object.values(state.players).map(p => p.name.toLowerCase()));
      const added = [], skipped = [];
      for (const name of names) {
        if (have.has(name.toLowerCase())) { skipped.push(name); continue; }
        have.add(name.toLowerCase());
        await store.putPlayer({ id: uid(), name, pos: "", pos2: [], active: true, history: [] });
        added.push(name);
      }
      render();
      const f = document.getElementById("qadd"); f.value = ""; f.focus();
      toast(added.length ? `${added.length === 1 ? added[0] : added.length + " Spieler"} hinzugefügt${skipped.length ? `. Schon vorhanden: ${skipped.join(", ")}` : ""}` : `Schon vorhanden: ${skipped.join(", ")}`);
      break;
    }
    case "goto-matchday": state.tab = "spieltag"; render(); break;
    case "cancel-edit": state.editing = null; state.draft = null; render(); break;
    case "save-player": {
      const name = document.getElementById("pname").value.trim();
      if (!name) { toast("Bitte einen Namen eingeben."); return; }
      const d = state.draft;
      const old = state.editing === "new" ? null : P(state.editing);
      if (!state.me && (!old || d.touched)) { toast("Wähle zuerst oben bei „Ich bin“ deinen Namen."); return; }
      const id = old ? old.id : uid();
      // my own rating (only if new, already rated by me, or I changed a value)
      if (d.orga && d.orga !== (d.orig || {}).orga) {
        const other = Object.values(state.players).find(q => q.id !== id && orgaOf(q) === d.orga);
        if (other) { toast(`${d.orga} ist schon mit ${other.name} verknüpft. Ändere dort zuerst „Orga-Mitglied“ auf „Nein“.`); return; }
      }
      const selfNow = !!state.me && d.orga === state.me;
      const entry = {};
      if (!selfNow && (!old || myRating(id) || d.touched)) { entry.attrs = { ...d.attrs }; entry.date = today(); }
      if (!selfNow && d.pos) { entry.pos = d.pos; entry.pos2 = d.pos2.filter(x => x !== d.pos); entry.posDate = today(); }
      if (Object.keys(entry).length) await store.putMyEntries({ [id]: entry });
      const p = { ...(old || {}), id };
      if (!old) delete p.attrs;
      const o = d.orig || {};
      const active = document.getElementById("pactive").checked;
      const newPos2 = d.pos2.filter(x => x !== d.pos);
      const posChanged = !old || d.pos !== o.pos || JSON.stringify(newPos2) !== JSON.stringify(o.pos2);
      if (!old || name !== o.name) p.name = name;
      if (!old || active !== o.active) p.active = active;
      if (!old || d.orga !== o.orga) p.orga = d.orga;
      if (!old) { p.pos = d.pos; p.pos2 = newPos2; p.sharedPos = d.pos; p.sharedPos2 = newPos2; }
      void posChanged;
      state.players[id] = p; applyConsensus();
      const after = ovr(p);
      p.ratedAt = (state.avg[id] && state.avg[id].last) || p.ratedAt || today();
      const history = old && old.history ? old.history.slice() : [];
      if (revealed(p)) {
        p.skill = after;
        if (!history.length || Math.abs(history[history.length - 1].ovr - after) >= 0.05) {
          if (history.length && history[history.length - 1].date === today()) history.pop();
          history.push({ date: today(), ovr: after });
        }
      } else delete p.skill;
      p.history = history.slice(-20);
      if (d.demo) p.demo = true;
      await store.putPlayer(p);
      const wasNew = state.editing === "new";
      state.editing = wasNew ? "new" : null; state.draft = null;
      toast(wasNew ? `${name} angelegt. Nächster Spieler?` : "Gespeichert");
      render(); if (wasNew) document.getElementById("pname")?.focus();
      break;
    }
    case "del-player": state.confirmDel = true; render(); break;
    case "cancel-del": state.confirmDel = false; state.confirmRow = null; render(); break;
    case "demo": {
      if (!state.me) { state.tab = "spieler"; render(); toast("Wähle zuerst, wer du bist."); return; }
      const ratings = {};
      for (const [name, skill, pos] of DEMO) {
        const attrs = {};
        for (const a of ALL_ATTRS) attrs[a.k] = a.k === "tor" ? (pos === "TW" ? skill : 1 + Math.floor(Math.random() * 4)) : a.k === "cha" ? 3 + Math.floor(Math.random() * 7) : Math.max(1, Math.min(10, skill + Math.round((Math.random() - 0.5) * 4)));
        const others = POS_ORDER.filter(k => k !== pos && LINE_OF[k] === LINE_OF[pos] && k !== "TW");
        const pos2 = name === "Tim" ? ["TW", "LV"] : shuffle(others).slice(0, Math.floor(Math.random() * 3)).sort((x, y) => POS_ORDER.indexOf(x) - POS_ORDER.indexOf(y));
        const p = { id: uid(), name, pos, pos2, active: true, demo: true, ratedAt: today() };
        p.skill = ovr({ ...p, attrs, __draft: true }); p.history = [{ date: p.ratedAt, ovr: p.skill }];
        ratings[p.id] = attrs;
        await store.putPlayer(p);
      }
      await store.putMyRatings(ratings);
      toast("Beispielspieler geladen"); state.tab = "spieler"; render(); break;
    }
    case "clear-demo": {
      const demoIds = Object.values(state.players).filter(p => p.demo).map(p => p.id);
      await store.delMyRatings(demoIds);
      for (const id of demoIds) await store.delPlayer(id);
      cur.selected = cur.selected.filter(id => state.players[id]); cur.a = null; cur.b = null; store.saveCurrent();
      toast("Beispielspieler entfernt"); render(); break;
    }
    case "sel-last": { const lg = lastGame(); if (lg) cur.selected = [...new Set([...cur.selected, ...lg.a, ...lg.b])].filter(id => state.players[id]); store.saveCurrent(); render(); break; }
    case "sel-none": cur.selected = []; cur.a = null; cur.b = null; store.saveCurrent(); render(); break;
    case "build": {
      const ids = cur.selected.filter(id => state.players[id]);
      const res = buildTeams(ids); cur.a = res.a; cur.b = res.b; state.swapSel = null; store.saveCurrent(); render();
      document.querySelector(".teams")?.scrollIntoView({ behavior: "smooth", block: "start" });
      break;
    }
    case "copy": copyText(waText(), document.getElementById("wa")); break;
    case "save-game": {
      const existing = Object.values(state.games).find(g => g.date === cur.date);
      const g = { id: existing ? existing.id : uid(), date: cur.date, a: cur.a.slice(), b: cur.b.slice() };
      if (existing && typeof existing.scoreA === "number") { g.scoreA = existing.scoreA; g.scoreB = existing.scoreB; }
      await store.putGame(g);
      toast(existing ? "Spieltag aktualisiert" : "Spieltag gespeichert. Vorrecht für nächste Woche steht.");
      cur.date = nextMonday(new Date(new Date(cur.date + "T12:00:00").getTime() + 864e5).toISOString().slice(0, 10));
      cur.selected = []; cur.a = null; cur.b = null; store.saveCurrent();
      state.tab = "statistik"; render(); break;
    }
    case "export": {
      const players = Object.fromEntries(Object.values(state.players).map(p => { const q = { ...p }; delete q.sharedPos; delete q.sharedPos2; delete q.posInfo; if (revealed(p)) q.attrs = attrsOf(p); else delete q.attrs; return [p.id, q]; }));
      const data = JSON.stringify({ app: "paulimania", v: 2, players, games: state.games });
      copyText(data, document.getElementById("backup")); break;
    }
    case "import": {
      const el = document.getElementById("backup");
      try {
        const d = JSON.parse(el.value);
        if (d.app !== "paulimania") throw new Error();
        for (const p of Object.values(d.players || {})) await store.putPlayer(normPlayer(p));
        for (const g of Object.values(d.games || {})) await store.putGame(g);
        await migrateLegacy();
        el.value = ""; toast("Sicherung eingefügt"); render();
      } catch (err) { toast("Das ist keine gültige Schneppenhausen-Sicherung."); }
      break;
    }
  }
});

view.addEventListener("change", async (e) => {
  const t = e.target;
  const cur = state.current;
  if (t.dataset.pick) {
    const id = t.dataset.pick;
    cur.selected = t.checked ? [...new Set([...cur.selected, id])] : cur.selected.filter(x => x !== id);
    store.saveCurrent(); render();
  } else if (t.id === "gdate") { cur.date = t.value || nextMonday(); store.saveCurrent(); }
  else if (t.dataset.score) {
    const g = { ...state.games[t.dataset.score] };
    const a = document.getElementById("sa-" + g.id).value, b = document.getElementById("sb-" + g.id).value;
    if (a !== "" && b !== "") { g.scoreA = +a; g.scoreB = +b; } else { delete g.scoreA; delete g.scoreB; }
    await store.putGame(g); if (a !== "" && b !== "") toast("Ergebnis gespeichert");
  }
});
view.addEventListener("input", (e) => {
  if (e.target.id === "filter") {
    state.filter = e.target.value; const pos = e.target.selectionStart;
    render(); const f = document.getElementById("filter"); f.focus(); f.setSelectionRange(pos, pos);
  }
});
view.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.dataset?.edit) e.target.click();
  if (e.key === "Enter" && e.target.id === "qadd") view.querySelector('[data-act="quick-add"]')?.click();
  if (e.key === "Enter" && e.target.id === "pname") view.querySelector('[data-act="save-player"]')?.click();
});
document.querySelector("nav.tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  state.tab = b.dataset.tab; state.editing = null; state.draft = null; render();
});

view.addEventListener("toggle", (e) => { if (e.target.id === "orgadet") state.orgaOpen = e.target.open; }, true);
document.getElementById("whoami").addEventListener("change", (e) => { if (e.target.value) setMe(e.target.value); });
state.me = loadMe(); state.myKey = state.me;
store.loadLocal();
migrateLegacy();
render();
initDb();
})();
