<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!--APP-START-->
<title>Schneppenhausen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a matchday sheet; pitch-green header band, two team columns side by side on wide screens. */
:root {
  --bg: #eef2ec;
  --surface: #ffffff;
  --ink: #142019;
  --muted: #5a6a60;
  --line: #d3dcd3;
  --pitch: #1d6b3d;
  --pitch-ink: #f4f8f2;
  --accent: #1d6b3d;
  --accent-soft: #dcebdf;
  --team-a: #c3c9c2;
  --team-a-soft: #f4f6f3;
  --team-b: #1b1f1c;
  --team-b-soft: #e1e5e0;
  --warn: #b5541c;
  --warn-soft: #f8e4d6;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1612; --surface: #18221c; --ink: #e6ede7; --muted: #95a69a; --line: #2b3a31;
    --pitch: #174f2f; --pitch-ink: #eef5ef; --accent: #5cc283; --accent-soft: #1f3a29;
    --team-a: #e8ebe7; --team-a-soft: #2a332d; --team-b: #6f7b73; --team-b-soft: #0f1411;
    --warn: #f08a52; --warn-soft: #3d2416; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1612; --surface: #18221c; --ink: #e6ede7; --muted: #95a69a; --line: #2b3a31;
  --pitch: #174f2f; --pitch-ink: #eef5ef; --accent: #5cc283; --accent-soft: #1f3a29;
  --team-a: #e8ebe7; --team-a-soft: #2a332d; --team-b: #6f7b73; --team-b-soft: #0f1411;
  --warn: #f08a52; --warn-soft: #3d2416; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { overscroll-behavior-y: contain; }
.ptr { position: fixed; left: 50%; top: env(safe-area-inset-top, 0px); z-index: 30; transform: translate(-50%, -60px);
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 8px 16px;
  font-size: 14px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.15); transition: transform .2s; pointer-events: none; white-space: nowrap; }
.ptr.dragging { transition: none; }
.ptr.ready { color: var(--accent); }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* Header band */
.band { background: var(--pitch); color: var(--pitch-ink); position: relative; overflow: hidden; }
.band::after {
  content: ""; position: absolute; right: -60px; top: 50%; width: 180px; height: 180px;
  border: 2px solid color-mix(in srgb, var(--pitch-ink) 25%, transparent); border-radius: 50%;
  transform: translateY(-50%); pointer-events: none;
}
.band::before {
  content: ""; position: absolute; right: 29px; top: 0; bottom: 0; width: 2px;
  background: color-mix(in srgb, var(--pitch-ink) 25%, transparent); pointer-events: none;
}
.band .wrap { padding-block: 18px 0; position: relative; z-index: 1; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 {
  font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: .5px;
  margin: 0; text-transform: uppercase; line-height: 1;
}
.brand span { font-size: 14px; opacity: .8; }
.whoami { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 14px; }
.whoami span { opacity: .8; }
.whoami select { background: color-mix(in srgb, var(--pitch-ink) 14%, transparent); color: var(--pitch-ink); border: 1px solid color-mix(in srgb, var(--pitch-ink) 35%, transparent); border-radius: 8px; padding: 5px 8px; font-weight: 600; }
.whoami select option { color: var(--ink); background: var(--surface); }
.panel.who { border-color: var(--accent); }
nav.tabs { display: flex; gap: 4px; margin-top: 14px; overflow-x: auto; }
nav.tabs button {
  border: 0; background: transparent; color: var(--pitch-ink); opacity: .75;
  font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .6px;
  text-transform: uppercase; padding: 8px 14px 10px; cursor: pointer; border-radius: 8px 8px 0 0;
}
nav.tabs button[aria-selected="true"] { background: var(--bg); color: var(--ink); opacity: 1; }
nav.tabs button:focus-visible { outline: 2px solid var(--pitch-ink); outline-offset: -2px; }

main .wrap { padding-block: 20px 60px; display: grid; gap: 20px; }
h2 {
  font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0;
  text-transform: uppercase; letter-spacing: .5px; text-wrap: balance;
}
h3 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0; letter-spacing: .4px; text-transform: uppercase; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; min-width: 0; }

/* Buttons */
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 9px;
  cursor: pointer; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--warn); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="text"], input[type="date"], input[type="number"], select, textarea {
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; min-width: 0;
}

/* Counter */
.counter { display: flex; align-items: baseline; gap: 6px; font-family: var(--font-display); }
.counter b { font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.counter span { font-size: 20px; color: var(--muted); }
.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.meter.over i { background: var(--warn); }

/* Chips */
.chip { font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.plain { background: var(--bg); color: var(--muted); }
.pos { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .5px; color: var(--muted); min-width: 56px; flex: none; }
.posgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .posgrid { grid-template-columns: 1fr; } }
.posname { text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 600; }
.pospick { display: grid; gap: 6px; }
.posline { display: grid; grid-template-columns: 72px 1fr; gap: 6px; align-items: center; }
.posline-l { font-size: 13px; color: var(--muted); }
.posline .seg button { min-width: 44px; padding: 7px 6px; font-family: var(--font-display); letter-spacing: .4px; font-size: 15px; }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.pos small { font-size: 11px; opacity: .7; font-weight: 600; }

/* Attendance list */
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.pick {
  display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; user-select: none; min-width: 0;
}
.pick input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.pick .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.pick.on { border-color: var(--accent); background: var(--accent-soft); }

/* Teams */
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .teams { grid-template-columns: 1fr; } }
.team { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; min-width: 0; }
.team header { padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-top: 5px solid var(--tc); background: var(--tcs); }
.team.a { --tc: var(--team-a); --tcs: var(--team-a-soft); }
.team.b { --tc: var(--team-b); --tcs: var(--team-b-soft); }
.team header h3 { color: var(--ink); }
.team .stat { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.team ol { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
.team li button {
  width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid transparent;
  background: transparent; padding: 7px 8px; border-radius: 8px; cursor: pointer;
}
.team li button:hover { background: var(--bg); }
.team li button.sel { border-color: var(--tc); background: var(--tcs); }
.team li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skill { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); font-size: 14px; }
.posbar { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 14px 12px; font-size: 13px; color: var(--muted); }
.balance { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
.balance b { font-variant-numeric: tabular-nums; }
.hint { font-size: 14px; color: var(--muted); }

/* Tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--bg); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.dots i.on { background: var(--accent); }

/* Editor */
.editor { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .editor { grid-template-columns: 1fr; } }
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--bg); padding: 7px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.scale button { padding: 7px 0; font-variant-numeric: tabular-nums; }

/* Rating editor */
.attrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
@media (max-width: 400px) { .attrs { grid-template-columns: 1fr; } }
.attr { display: grid; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); min-width: 0; }
.attr.dim { opacity: .7; }
.attr-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.attr-val { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.attr .seg button { background: var(--surface); padding: 6px 0; }
.attr .seg button[aria-pressed="true"] { background: var(--accent); }
.check { display: flex; gap: 8px; align-items: flex-start; }
.check input { flex: none; margin-top: 3px; }
.intro { margin: 0; color: var(--muted); font-size: 15px; max-width: 62ch; }
.plrows { display: grid; gap: 6px; }
.plrow { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.plrow.off { opacity: .6; }
.plmain { display: grid; gap: 2px; min-width: 0; }
.plname { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.placts { display: grid; gap: 4px; }
.placts .btn { justify-content: center; }
.delbox { grid-column: 1 / -1; display: grid; gap: 8px; padding: 10px 12px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); }
.delbox .hint { color: var(--ink); }
.holdbtn { position: relative; overflow: hidden; color: var(--warn); border-color: var(--warn); background: var(--surface);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; min-width: 170px; justify-content: center; }
.holdbtn i { position: absolute; inset: 0 auto 0 0; width: 0; background: color-mix(in srgb, var(--warn) 35%, transparent); pointer-events: none; }
.holdbtn span { position: relative; pointer-events: none; font-variant-numeric: tabular-nums; }
.plmeta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.plscore { display: flex; align-items: baseline; gap: 4px; }
.plscore b { font-family: var(--font-display); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.posnow { display: grid; gap: 2px; padding: 10px 12px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line); }
.selfavg { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.savg { display: grid; gap: 6px; }
.savg-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 34px; gap: 10px; align-items: center; font-size: 14px; }
.savg-row b { text-align: right; font-variant-numeric: tabular-nums; }
.savg-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.savg-bar i { display: block; height: 100%; background: var(--accent); }
.rings { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.ring { display: grid; justify-items: center; gap: 3px; min-width: 0; }
.ring svg { width: 62px; height: 62px; max-width: 100%; }
.ring-n { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.plscore .mine { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ring-s { font-size: 12px; font-weight: 600; color: var(--warn); }
.ring-s.ok { color: var(--accent); }
/* live position strip on the matchday */
.pstrip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 3px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.pcell { display: grid; justify-items: center; border-radius: 7px; padding: 4px 0; border: 2px solid transparent; cursor: pointer; min-width: 0; }
.pcell .k { font-family: var(--font-display); font-weight: 700; font-size: 12px; }
.pcell .v { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pcell.ok { background: var(--accent-soft); color: var(--accent); }
.pcell.miss { background: #ffe9a8; color: #6d4c00; }
.pcell.zero { background: #ffd3c0; color: #8a3a10; }
.pcell.over { background: #e3e7ff; color: #2f3d8a; }
.pcell.sel { border-color: var(--ink); }
.taphint { font-size: 11.5px; color: var(--muted); text-align: center; margin: -14px 0 0; }
.latebtn { border-color: #7a4fd0; color: #7a4fd0; }
.latebtn.on { background: #ece5fb; }
.latesheet { border: 2px solid #7a4fd0; border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.pick.lateopt.on { border-color: #7a4fd0; background: #ece5fb; }
.pick.lateopt input { accent-color: #7a4fd0; }
.imgov { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.7); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.imgov[hidden] { display: none; }
.imgovbox { background: var(--surface); color: var(--ink); border-radius: 14px; padding: 14px; display: grid; gap: 10px; max-width: 460px; width: 100%; max-height: 100%; overflow: auto; }
.imgovbox p { margin: 0; font-size: 14px; }
.imgovbox img { width: 100%; height: auto; border-radius: 8px; -webkit-touch-callout: default; }
/* statistics */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--bg); text-align: center; display: grid; }
.tile b { font-family: var(--font-display); font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); }
.duel { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; }
.duelbar { height: 12px; border-radius: 6px; overflow: hidden; display: flex; border: 1px solid var(--line); background: var(--bg); }
.duelbar i { display: block; height: 100%; }
.duelbar i.w { background: #e6e9e5; } .duelbar i.d { background: var(--accent); opacity: .45; } .duelbar i.s { background: #0b0d0c; box-shadow: inset 0 0 0 1px #6b7770; }
.mc { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.mc.open { border: 2px dashed var(--accent); }
.mchd { display: flex; justify-content: space-between; gap: 8px; padding: 6px 12px; font-size: 12.5px; color: var(--muted); background: var(--bg); font-weight: 600; }
.mcsb { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; }
.mctm { padding: 12px 10px; display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 18px; text-transform: uppercase; }
.mctm.w { background: #f4f6f3; color: #142019; }
.mctm.s { background: #0b0d0c; color: #fff; justify-content: flex-end; box-shadow: inset 1px 0 0 var(--line); }
.mctm.s .tdot.s { border-color: #fff; }
.scnum { border: 0; background: transparent; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 36px; padding: 0 14px; font-variant-numeric: tabular-nums; color: var(--ink); }
.scnum.todo { font-size: 17px; line-height: 1.1; color: var(--accent); }
.scedit { display: flex; align-items: center; gap: 6px; padding: 6px 8px; font-family: var(--font-display); font-weight: 700; font-size: 26px; }
.scedit input { width: 58px; text-align: center; font-size: 22px; font-weight: 700; padding: 6px 4px; }
.mcft { padding: 6px 12px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.winchip { font-size: 11px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; background: var(--accent); color: #fff; border-radius: 99px; padding: 2px 8px; }
.linkbtn { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; padding: 4px 0; }
.mcdet { padding: 8px 12px 10px; display: grid; gap: 6px; font-size: 13.5px; border-top: 1px solid var(--line); }
.ps { display: grid; gap: 8px; }
.psr { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.rk { font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 16px; text-align: center; }
.psn { font-weight: 600; font-size: 14.5px; }
.psm { font-size: 12.5px; color: var(--muted); }
.psq { font-variant-numeric: tabular-nums; font-size: 14px; }
.statseg { justify-self: start; }
.linegrp { display: grid; gap: 4px; }
.linelab { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); }
.need { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; padding: 2px 6px; border-radius: 99px; background: #ffe9a8; color: #6d4c00; flex: none; }
.fbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #fff3cf; color: #3a2e00; border: 1px solid #e8cf7a; border-radius: 9px; padding: 7px 10px; font-size: 14px; }
/* position check */
.fmap { background: var(--pitch); border-radius: 10px; padding: 10px 6px; display: grid; gap: 8px; }
.fline { display: flex; justify-content: space-around; }
.fslot { display: grid; justify-items: center; gap: 2px; min-width: 56px; }

  const surplus = {}, deficit = {};
  for (const k of curPosOrder()) { const d = (c[k] || 0) - (need[k] || 0); if (d > 0) surplus[k] = d; if (d < 0) deficit[k] = -d; }
  const used = new Set(), sugg = [];
  for (const D of curPosOrder()) for (let n = 0; n < (deficit[D] || 0); n++) {
    const cands = ids.filter(id => !used.has(id)).map(id => {
      const from = playPos(id), alt = altPos(P(id));
      let score = -1;
      if (!from) score = 2;
      else if (surplus[from] > 0 && alt.includes(D)) score = 3;
      else if (surplus[from] > 0 && LINE_OF[from] === LINE_OF[D] && D !== "TW") score = 1;
      return { id, from, score, alt: alt.includes(D) };
    }).filter(x => x.score > 0).sort((x, y) => y.score - x.score || (P(x.id).name).localeCompare(P(y.id).name, "de"));
    const best = cands[0]; if (!best) break;
    used.add(best.id); if (best.from) surplus[best.from]--;
    sugg.push({ id: best.id, from: best.from, to: D, alt: best.alt });
  }
  return { c, need, surplus, deficit, unknown, sugg, conflicts: Object.keys(deficit).length + Object.keys(surplus).length };
}
function positionPanel(ids) {

  const assign = state.current.assign || {};
  const cell = k => { const have = r.c[k] || 0, need = r.need[k] || 0; const cls = have > need ? "over" : have < need ? "under" : ""; return `<div class="fslot"><span class="fk">${posLabel(k)}</span><span class="fc ${cls}">${have}/${need}</span></div>`; };
  const changed = Object.entries(assign).filter(([id]) => ids.includes(id) && P(id));
  return `<section class="panel">

  </section>`;
}

function buildTeamsRandomOld(ids) {
  const score = makeScorer(ids);
  const half = Math.ceil(ids.length / 2);
  const found = new Map();
  for (let r = 0; r < 150; r++) {
    const s = shuffle(ids);
    let a = s.slice(0, half), b = s.slice(half);
    let best = score(a, b), improved = true;
    while (improved) {
      improved = false;
      for (let i = 0; i < a.length && !improved; i++) for (let j = 0; j < b.length; j++) {
        const na = a.slice(), nb = b.slice(); [na[i], nb[j]] = [nb[j], na[i]];
        const c = score(na, nb);
        if (c < best - 1e-9) { a = na; b = nb; best = c; improved = true; break; }
      }
    }
    const key = a.slice().sort().join(",");
    if (!found.has(key)) found.set(key, { a, b, cost: best });
  }
  const all = [...found.values()].sort((x, y) => x.cost - y.cost);
  const top = all.filter(x => x.cost <= all[0].cost + 1.5).slice(0, 8);
  const pick = top[Math.floor(Math.random() * top.length)];
  return { a: pick.a, b: pick.b };
}
function teamStats(t) {
  const all = t.map(P).filter(Boolean);
  const ps = all.filter(revealed);
  const sum = ps.reduce((s, p) => s + ovr(p), 0);
  const byPos = Object.fromEntries(LINE_ORDER.map(k => [k, ps.filter(p => LINE_OF[p.pos] === k).length]));
  const attrAvg = Object.fromEntries(BAL_ATTRS.map(a => { const q = a.k === "cha" ? ps : ps.filter(p => !isGK(p)); return [a.k, q.length ? q.reduce((s, p) => s + attrsOf(p)[a.k], 0) / q.length : 0]; }));
  const byLine = Object.fromEntries(LINE_ORDER.map(k => [k, all.filter(p => LINE_OF[playPos(p.id)] === k).length]));
  return { n: all.length, shown: ps.length, sum, avg: ps.length ? sum / ps.length : 0, byPos: byLine, attrAvg };
}
function sortTeam(t) {
  return t.slice().sort((x, y) => POS_ORDER.indexOf(playPos(x)) - POS_ORDER.indexOf(playPos(y)) || (P(x)?.name || "").localeCompare(P(y)?.name || "", "de"));
}

/* ---------- attendance stats ---------- */
function playerStats(field = "big") {
  const games = sortedGames(field);
  const recent = games.slice(0, 8);
  const res = {};
  for (const p of Object.values(state.players)) res[p.id] = { total: 0, recent: recent.map(() => false), last: null, w: 0, d: 0, l: 0 };
  games.forEach((g) => {
    const has = typeof g.scoreA === "number" && typeof g.scoreB === "number";
    for (const [side, ids] of [["a", g.a], ["b", g.b]]) for (const id of ids) {
      const r = res[id]; if (!r) continue;
      r.total++; if (!r.last) r.last = g.date;
      if (has) { const my = side === "a" ? g.scoreA : g.scoreB, op = side === "a" ? g.scoreB : g.scoreA; if (my > op) r.w++; else if (my < op) r.l++; else r.d++; }
    }
  });
  recent.forEach((g, i) => { for (const id of [...g.a, ...g.b]) if (res[id]) res[id].recent[i] = true; });
  return res;
}
function trend(p) {
  const h = p.history || [];
  if (h.length < 2) return 0;
  const d = h[h.length - 1].ovr - h[h.length - 2].ovr;
  return Math.abs(d) < 0.05 ? 0 : d;
}
function statusOf(p, st, lg) {
  if (lg && (lg.a.includes(p.id) || lg.b.includes(p.id))) return { label: "Vorrecht", cls: "" };
  if (!st.total) return { label: "Neu", cls: "plain" };
  const weeks = st.last ? Math.floor((Date.now() - new Date(st.last + "T12:00:00")) / 6048e5) : 99;
  if (weeks >= 4) return { label: `${weeks} Wo. weg`, cls: "warn" };
  return { label: "Ersatz", cls: "plain" };
}

  // ticked players first, strongest on top (players whose numbers are still hidden come last)

  }).join("")}</div><p class="taphint">Tippe auf eine Position, um passende Spieler zu zeigen</p>`;

  ].filter(g => g[1].length || pf);

      <div><button class="btn small-btn" data-act="late-toggle">Fertig</button></div></div>` : ""}
  </section>`;

  if (cur.a && cur.b) html += renderTeams();
  view.innerHTML = html;
}

function renderTeams() {
  const cur = state.current;
  const A = teamStats(cur.a), B = teamStats(cur.b);
  const diff = Math.round(Math.abs(A.sum - B.sum) * 10) / 10;

      <span class="cmp-l">${at.short}</span>
      <div class="cmp-bar b"><i style="width:${vb * 10}%"></i></div>
      <span class="cmp-v">${f1(vb)}</span></div>`; }).join("");
  const missing = [...cur.selected].filter(id => state.players[id] && !cur.a.includes(id) && !cur.b.includes(id));
  const unr = [...cur.a, ...cur.b].filter(id => P(id) && !isRated(P(id))).length;
  const partial = [...cur.a, ...cur.b].filter(id => P(id) && isRated(P(id)) && !revealed(P(id))).length;
  const nopos = [...cur.a, ...cur.b].filter(id => P(id) && !P(id).pos).length;
  const stale = cur.a.length + cur.b.length !== cur.selected.filter(id => state.players[id]).length || missing.length
    || (cur.builtAssign !== undefined && cur.builtAssign !== buildSig());
  const team = (key, title, t, st) => `
    <div class="team ${key}">
      <header><h3>${title}</h3><span class="stat">${st.n} Spieler · Ø ${st.shown ? f1(st.avg) + (st.shown < st.n ? ` (aus ${st.shown})` : "") : "?"}</span></header>
      <ol>${sortTeam(t).map(id => { const p = P(id); if (!p) return ""; return `<li><button data-swap="${id}" class="${state.swapSel === id ? "sel" : ""}">
        <span class="pos">${fieldPos(id) || "–"}</span><span class="nm">${esc(p.name)}${isLate(id) ? " ⏰" : ""}</span><span class="skill">${ovrText(p)}</span></button></li>`; }).join("")}</ol>
      <div class="posbar">${LINE_ORDER.map(k => `<span>${LINES[k]} ${st.byPos[k]}</span>`).join("")}</div>
    </div>`;
  return `
  <section class="panel">
    <div class="row spread">
      <h2>Teams</h2>
      <div class="balance"><span>Stärke <b>${f1(A.sum)}</b> : <b>${f1(B.sum)}</b></span>
        <span class="chip ${diff > 3 ? "warn" : ""}">${diff < 0.05 ? "Exakt ausgeglichen" : `Differenz ${f1(diff)}`}</span></div>
    </div>
    ${stale ? `<p class="chip warn" style="justify-self:start">Auswahl hat sich geändert. „Neu mischen“ drücken.</p>` : ""}
    ${unr || nopos || partial ? `<p class="hint" style="margin:0"><span class="chip warn">Hinweis</span> ${[unr ? `${unr} Spieler ${unr === 1 ? "ist" : "sind"} noch nicht bewertet und ${unr === 1 ? "zählt" : "zählen"} als Durchschnitt (5)` : "", partial ? `${partial} noch nicht von allen bewertet (Zahl als „?“, für die Verteilung zählen die vorhandenen Bewertungen)` : "", nopos ? `${nopos} ohne Position` : ""].filter(Boolean).join(", ")}. Stärke und Vergleich zeigen nur fertig bewertete Spieler.</p>` : ""}
    ${lineupPitch(cur.a, cur.b)}
    <div class="teams">${team("a", "Team Weiß", cur.a, A)}${team("b", "Team Schwarz", cur.b, B)}</div>
    ${distributionPanel(cur.a, cur.b)}
    <details class="cmp"><summary>Vergleich nach Kriterien (Durchschnitt pro Team)</summary>
      <div class="cmp-grid">${cmp}</div></details>
    <p class="hint">Tausch von Hand: einen Spieler antippen, dann einen aus dem anderen Team. Die Stärkewerte sind nur für dich und kommen nicht in den WhatsApp-Text.</p>
    <div class="row">
      <button class="btn primary" data-act="copy">Für WhatsApp kopieren</button>
      <button class="btn" data-act="share-img">Aufstellung als Bild</button>
      <button class="btn" data-act="save-game">Spieltag speichern</button>
      <button class="btn ghost danger" data-act="clear-teams">${state.confirmClearTeams ? "Wirklich verwerfen?" : "Teams verwerfen"}</button>
    </div>
    <p class="hint" style="margin:0">„Teams verwerfen“ löscht nur die Teams. Die abgehakten Spieler und die Umstellungen aus „Positionen prüfen“ bleiben.</p>
    <textarea id="wa" readonly hidden></textarea>
  </section>`;
}

// Overview: how many players each organizer has rated (himself excluded).
function progressPanel(players) {
  const done = players.filter(revealed).length;
  const R = 25, C = 2 * Math.PI * R;
  const rings = ORGA.map(n => {
    const todo = players.filter(p => orgaOf(p) !== n);
    const rated = todo.filter(p => ratersOf(p).includes(n)).length;
    const left = todo.length - rated, ok = left === 0 && todo.length > 0;
    const off = todo.length ? C * (1 - rated / todo.length) : C;
    return `<div class="ring" title="${n}: ${rated} von ${todo.length} bewertet">
      <svg viewBox="0 0 62 62" aria-hidden="true">
        <circle cx="31" cy="31" r="${R}" fill="none" style="stroke:var(--line)" stroke-width="7"/>
        <circle cx="31" cy="31" r="${R}" fill="none" style="stroke:var(${ok ? "--accent" : "--warn"})" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 31 31)"/>
        <text x="31" y="36.5" text-anchor="middle" style="fill:var(--ink);font-family:var(--font-display);font-weight:700;font-size:17px">${rated}</text>
      </svg>
      <span class="ring-n">${n}${n === state.me ? " (du)" : ""}</span>
      <span class="ring-s ${ok ? "ok" : ""}">${ok ? "fertig" : `noch ${left}`}</span>
    </div>`;
  }).join("");
  return `<section class="panel">
    <div class="row spread"><h2>Bewertet</h2><span class="hint">${done}/${players.length} Spieler fertig</span></div>
    <div class="rings" role="list" aria-label="Bewertungsstand pro Orga-Mitglied">${rings}</div>
  </section>`;
}

function quickAdd(first) {
  return `<section class="panel">
    <h2>${first ? "Spieler anlegen" : "Spieler hinzufügen"}</h2>
    ${intro("Erst mal nur die Namen eintragen. Mehrere auf einmal gehen mit Komma getrennt. Positionen und Bewertung trägt danach jeder aus dem Orga-Team über „Bearbeiten“ ein.")}
    <div class="row"><input type="text" id="qadd" placeholder="z. B. Max K., Tom, Jan S." autocomplete="off" style="flex:1;min-width:180px">
      <button class="btn primary" data-act="quick-add">Hinzufügen</button></div>
    ${first ? `<div><button class="btn ghost" data-act="demo">Oder: Beispielspieler zum Testen laden</button></div>` : ""}
  </section>`;
}

      ${state.me ? `<span class="chip ${mineMissing.length ? "warn" : ""}">${mineMissing.length ? `${state.me}, du hast ${rateable.length - mineMissing.length} von ${rateable.length} bewertet` : `${state.me}, du hast alle bewertet`}</span>` : ""}
      ${nobody ? `<span class="chip warn">${nobody} noch von niemandem bewertet</span>` : ""}

        </div>
        <div class="plscore"><b>${ovrText(p)}</b>${myOvrText(p)}${tr && revealed(p) ? `<span class="trend ${tr > 0 ? "up" : "down"}">${tr > 0 ? "▲" : "▼"}</span>` : ""}</div>
        <div class="placts">
          <button class="btn small-btn" data-edit="${p.id}">${myRating(p.id) || isSelf(p) ? "Bearbeiten" : "Bewerten"}</button>

        </div>
        ${state.confirmRow === p.id ? `<div class="delbox"><b>Wirklich löschen?</b>

function renderEditor() {
  const isNew = state.editing === "new";
  const p = isNew ? { name: "", pos: "ZM", pos2: [], active: true, attrs: Object.fromEntries(ALL_ATTRS.map(a => [a.k, a.k === "tor" ? 2 : 5])) } : P(state.editing);
  if (!p) { state.editing = null; return ""; }
  const mine = isNew ? null : myRating(p.id);
  const avg = isNew ? null : state.avg[p.id];
  const round = at => Object.fromEntries(Object.entries(at).map(([k, v]) => [k, Math.min(10, Math.max(1, Math.round(v)))]));
  const myPos = isNew ? null : myPosVote(p.id);
  const startPos = myPos ? mapPos(myPos.pos) : p.pos || "";
  const startPos2 = myPos ? [...new Set((myPos.pos2 || []).map(mapPos))].filter(x => POS[x] && x !== startPos) : altOf(p).slice();
  const d = state.draft || (state.draft = {
    ...p, __draft: true, pos: startPos, pos2: startPos2, touched: false,
    orig: { name: p.name, pos: startPos, pos2: startPos2.slice(), active: p.active !== false, orga: orgaOf(p) },
    orga: orgaOf(p),
    attrs: mine ? attrsOf({ ...p, __draft: true, attrs: mine.attrs })

  const scale = (k, val) => `<div class="seg scale">${Array.from({ length: 10 }, (_, i) => i + 1).map(v => `<button data-dattr="${k}" data-v="${v}" aria-pressed="${val === v}" aria-label="${v}">${v}</button>`).join("")}</div>`;
  const hist = (p.history || []).slice(-6);
  const preview = ovr(d);
  const others = avg ? avg.raters.filter(r => r !== state.me) : [];
  const avgLine = !avg ? "" : revealed(p)
    ? `Durchschnitt aus ${avg.n} Bewertung${avg.n === 1 ? "" : "en"}: <b>${f1(ovr(p))}</b> · bewertet von ${avg.raters.map(raterName).join(", ")}`
    : `${ratersOf(p).length} von ${requiredRaters(p).length} haben bewertet (${avg.raters.map(raterName).join(", ")}) · fehlt noch: ${missingRaters(p).join(", ")}. Die Zahl erscheint, sobald alle bewertet haben.`;
  const myNote = !state.me ? "Wähle zuerst oben bei „Ich bin“ deinen Namen, sonst kann deine Bewertung nicht gespeichert werden."
    : isNew ? "Deine Bewertung ist die erste. Die anderen aus dem Orga-Team können ihn danach selbst bewerten."
    : mine ? "Das ist deine eigene Bewertung. Die anderen sehen nur den Durchschnitt, nicht deine einzelnen Werte."
    : revealed(p) ? `Du hast ${esc(p.name)} noch nicht bewertet. Die Werte sind mit dem aktuellen Durchschnitt vorbelegt. Deine Bewertung zählt erst, wenn du etwas änderst und speicherst.`
    : `Du hast ${esc(p.name)} noch nicht bewertet. Alle Werte stehen auf 5. Die Bewertungen der anderen siehst du nicht. Deine Bewertung zählt, sobald du mindestens einen Wert antippst und speicherst.`;
  return `<section class="panel" id="editor">
    <div class="row spread"><h2>${isNew ? "Neuer Spieler" : `${esc(p.name)} bearbeiten`}</h2>
      ${!isNew && isSelf(p) ? "" : `<div class="counter"><b>${f1(preview)}</b><span>deine Wertung</span></div>`}</div>
    ${avgLine ? `<p class="small" style="margin:0">${avgLine}</p>` : ""}
    <div class="editor">
      <div class="field"><label for="pname">Name</label><input type="text" id="pname" value="${esc(d.name)}" placeholder="z. B. Max K." autocomplete="off"></div>
    </div>
    ${isNew ? "" : `<div class="posnow"><b>Positionen jetzt: ${p.pos ? `${p.pos}${altOf(p).length ? `, auch ${altOf(p).join(", ")}` : ""}` : "noch keine"}</b>
      <span class="hint">${posInfoText(p)}</span></div>`}
    ${!isNew && isSelf(p) ? `<p class="hint" style="margin:0">Deine Positionen schätzen die anderen drei ein.</p>` : `
    <p class="hint" style="margin:0">${isNew ? "" : myPos ? "Unten steht deine eigene Einschätzung. Es zählt die Mehrheit aller Einschätzungen." : "Unten ist der aktuelle Stand vorausgewählt. Passe ihn an, wenn du es anders siehst. Mit „Speichern“ zählt das als deine Einschätzung."}</p>
    <div class="posgrid">
      <div class="field"><label>${isNew ? "" : "Deine "}Hauptposition: <span class="posname">${d.pos ? `${d.pos} · ${POS[d.pos]}` : "noch keine"}</span></label>${posPicker("dpos", d.pos, null)}</div>
      <div class="field"><label>Nebenpositionen: <span class="posname">${d.pos2.length ? d.pos2.join(", ") : "keine"}</span></label>
        ${posPicker("dpos2", d.pos2, d.pos)}
        <span class="hint">Mehrere möglich: alle antippen, wo er auch spielen kann. Eine Nebenposition gilt, sobald mindestens ${POS2_NEEDED} von euch sie gewählt haben. TW als Nebenposition heißt: kann notfalls ins Tor.</span></div>

    <div class="field"><label>Orga-Mitglied</label><div class="seg">

    <label class="check small"><input type="checkbox" id="pactive" ${d.active !== false ? "checked" : ""}> Aktiv (pausierte Spieler, z. B. verletzt, erscheinen nicht in der Spieltag-Auswahl)</label>
    ${hist.length > 1 && revealed(p) ? `<div class="small"><span class="muted">Entwicklung:</span> ${hist.map(h => `<span title="${fmtDate(h.date)}">${f1(h.ovr)} <span class="muted">(${fmtDate(h.date)})</span></span>`).join(" → ")}</div>` : ""}

    </div>
  </section>`;
}

function renderStats() {
  const players = playerList();
  const sf = state.statField === "small" ? "small" : "big";
  const fieldSwitch = `<div class="seg statseg" role="group" aria-label="Statistik für"><button data-statf="big" aria-pressed="${sf === "big"}">Großfeld</button><button data-statf="small" aria-pressed="${sf === "small"}">Kleinfeld</button></div>`;
  const games = sortedGames(sf).slice().reverse(); // oldest first, new matchdays are added below
  if (!games.length) {
    view.innerHTML = `${fieldSwitch}<div class="panel empty"><h2>Noch keine ${sf === "small" ? "Kleinfeld-" : ""}Statistik</h2>
      <p class="muted" style="max-width:46ch">Sobald du unter „Spieltag“ Teams erstellt und auf „Spieltag speichern“ gedrückt hast, siehst du hier die Saison, alle Ergebnisse und wer wie oft dabei war.</p>
      <button class="btn primary" data-act="goto-matchday">Zum Spieltag</button></div>`;
    return;
  }
  const has = g => typeof g.scoreA === "number" && typeof g.scoreB === "number";
  const played = games.filter(has);
  const goals = played.reduce((n, g) => n + g.scoreA + g.scoreB, 0);
  const wW = played.filter(g => g.scoreA > g.scoreB).length, wS = played.filter(g => g.scoreB > g.scoreA).length, dr = played.length - wW - wS;
  const pct = v => played.length ? (v / played.length * 100).toFixed(1) : 0;

  // ---- season summary
  let html = `${fieldSwitch}<section class="panel"><h2>Saison${sf === "small" ? " · Kleinfeld" : ""}</h2>
    <div class="tiles"><div class="tile"><b>${games.length}</b><span>Spieltag${games.length === 1 ? "" : "e"}</span></div>
      <div class="tile"><b>${played.length ? goals : "–"}</b><span>Tore</span></div>
      <div class="tile"><b>${played.length ? f1(goals / played.length) : "–"}</b><span>Tore/Spiel</span></div></div>
    ${played.length ? `<div class="duel"><span><span class="tdot w"></span> Weiß ${wW}</span>
      <div class="duelbar"><i style="width:${pct(wW)}%" class="w"></i><i style="width:${pct(dr)}%" class="d"></i><i style="width:${pct(wS)}%" class="s"></i></div>
      <span>${wS} Schwarz <span class="tdot s"></span></span></div>
      <p class="hint" style="text-align:center;margin:0">${dr} Unentschieden</p>`
      : `<p class="hint" style="margin:0">Sobald ein Ergebnis eingetragen ist, steht hier die Bilanz Weiß gegen Schwarz.</p>`}
  </section>`;

  // ---- results as match cards
  html += `<section class="panel"><h2>Ergebnisse</h2>${games.map((g, i) => {
    const done = has(g), edit = state.editScore === g.id || !done && state.editScore === g.id, open = state.openGame === g.id;
    const res = !done ? "" : g.scoreA > g.scoreB ? `<span class="winchip">Sieg Weiß</span>` : g.scoreB > g.scoreA ? `<span class="winchip">Sieg Schwarz</span>` : `<span class="chip">Unentschieden</span>`;
    const centre = edit
      ? `<div class="scedit"><input type="number" min="0" inputmode="numeric" id="sa-${g.id}" value="${g.scoreA ?? ""}" aria-label="Tore Weiß"><span>:</span><input type="number" min="0" inputmode="numeric" id="sb-${g.id}" value="${g.scoreB ?? ""}" aria-label="Tore Schwarz"></div>`
      : done ? `<button class="scnum" data-editscore="${g.id}" title="Ergebnis ändern">${g.scoreA} : ${g.scoreB}</button>`
      : `<button class="scnum todo" data-editscore="${g.id}">Ergebnis<br>eintragen</button>`;
    const names = ids => ids.map(id => esc(P(id)?.name || "gelöschter Spieler")).join(", ");
    return `<div class="mc ${done ? "" : "open"}">
      <div class="mchd"><span>${sf === "small" ? "Kleinfeld" : "Spieltag"} ${i + 1} · ${fmtDate(g.date)}</span><span>${sf === "small" && g.format ? `${g.format} gg. ${g.format}` : `${g.a.length + g.b.length} Spieler`}</span></div>
      <div class="mcsb"><div class="mctm w"><span class="tdot w"></span>Weiß</div>${centre}<div class="mctm s">Schwarz<span class="tdot s"></span></div></div>
      ${edit ? `<div class="mcft"><span class="hint">Tore Weiß : Tore Schwarz</span><span class="row"><button class="btn small-btn ghost" data-act="cancel-score">Abbrechen</button><button class="btn small-btn primary" data-savescore="${g.id}">Speichern</button></span></div>`
        : `<div class="mcft"><span>${res}</span><button class="linkbtn" data-opengame="${g.id}" aria-expanded="${open}">Aufstellung ${open ? "▴" : "›"}</button></div>`}
      ${open ? `<div class="mcdet"><div><b>Weiß:</b> ${names(g.a)}</div><div><b>Schwarz:</b> ${names(g.b)}</div>
        <div><button class="btn small-btn ghost danger" data-delgame="${g.id}">${state.confirmGame === g.id ? "Wirklich löschen?" : "Spieltag löschen"}</button></div></div>` : ""}
    </div>`;
  }).join("")}</section>`;

  // ---- players as a ranking
  const stats = playerStats(sf);
  const lg = lastGame(sf);
  const order = players.slice().sort((x, y) => stats[y.id].total - stats[x.id].total || x.name.localeCompare(y.name, "de"));
  html += `<section class="panel"><h2>Wer war wie oft dabei?</h2>
    <div class="ps">${order.map((p, i) => { const st = stats[p.id]; const s = statusOf(p, st, lg); const q = Math.round(st.total / games.length * 100); return `
      <div class="psr"><span class="rk">${st.total ? i + 1 : "–"}</span>
        <div style="min-width:0"><div class="psn">${esc(p.name)} <span class="chip ${s.cls}">${s.label}</span>${p.active === false ? ` <span class="chip plain">pausiert</span>` : ""}</div>

function selfAverages(p) {

    return `<div class="selfavg"><b>Deine Durchschnittswerte</b><p class="hint" style="margin:0">Erscheinen, sobald ${requiredRaters(p).join(", ")} dich bewertet haben.${miss.length ? ` Es fehlt noch: ${miss.join(", ")}.` : ""}</p></div>`;

function holdBtn(id) { return `<button class="btn small-btn holdbtn" data-hold="${id}" type="button"><i></i><span>5 s gedrückt halten</span></button>`; }
let hold = null;
function startHold(btn) {
  if (hold) return;
  const id = btn.dataset.hold, bar = btn.querySelector("i"), label = btn.querySelector("span");
  btn.classList.add("holding");

view.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.dataset?.edit) e.target.click();
  if (e.key === "Enter" && /^s[ab]-/.test(e.target.id || "")) { const id = e.target.id.slice(3); view.querySelector(`[data-savescore="${id}"]`)?.click(); }
  if (e.key === "Enter" && e.target.id === "qadd") view.querySelector('[data-act="quick-add"]')?.click();
  if (e.key === "Enter" && e.target.id === "pname") view.querySelector('[data-act="save-player"]')?.click();
});
document.querySelector("nav.tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  state.tab = b.dataset.tab; state.editing = null; state.draft = null; render();
});

view.addEventListener("toggle", (e) => { if (e.target.id === "orgadet") state.orgaOpen = e.target.open; }, true);
document.getElementById("whoami").addEventListener("change", (e) => { if (e.target.value) setMe(e.target.value); });
state.me = loadMe(); state.myKey = state.me;
store.loadLocal();
migrateLegacy();
render();
initDb();
})();
</script>
<!--APP-END-->
</body>
</html>
